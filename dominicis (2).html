<style>
  html, body { height: 100%; }
  body {
    overflow: hidden;

  #app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  #app > *, #vista, .scrolla { min-height: 0; }

  /* mancava: un pulsante deve dire di essere un pulsante */
  button:not(:disabled), [role="switch"]:not(:disabled), a[href], label.scelta, summary { cursor: pointer; }
  button:disabled, [role="switch"]:disabled { cursor: not-allowed; }
  select, input[type="date"], input[type="file"] { cursor: pointer; }

  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.035em; white-space: nowrap; }

  .display { font-family: "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.02em; font-variation-settings: "opsz" 40; }

  .occhiello { font-size: 12px; letter-spacing: 0.11em; text-transform: uppercase; color: #6B7178; font-weight: 500; }

  .scrolla { overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
  .scrolla > * { overflow-anchor: none; }

  .scrolla::-webkit-scrollbar { width: 12px; height: 12px; }
  .scrolla::-webkit-scrollbar-thumb { background: #CFCBC0; border-radius: 99px; border: 4px solid transparent; background-clip: content-box; }
  .scrolla::-webkit-scrollbar-thumb:hover { background: #B4AFA2; background-clip: content-box; }
  .scrolla::-webkit-scrollbar-track { background: transparent; }

  :focus-visible { outline: 2px solid #35608F; outline-offset: 3px; border-radius: 6px; }

  /* superficie: il bordo sottile fa il lavoro, l'ombra dà la quota */
  .card {
    background: #fff;
    border: 1px solid #E5E2DA;
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(20,23,26,.04), 0 8px 24px -16px rgba(20,23,26,.18);
  }
  .card-vivo { transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s; }
  .card-vivo:hover {
    transform: translateY(-2px);
    border-color: #CFCBC0;
    box-shadow: 0 2px 4px rgba(20,23,26,.05), 0 18px 40px -22px rgba(20,23,26,.3);
  }

  .riga-tab { transition: background-color .14s; }
  .riga-tab:hover { background: #FAF9F6; }

  /* telaio del telefono */
  .telaio {
    width: 392px; max-width: 100%; height: 812px;
    border-radius: 48px; background: #14171A; padding: 11px;
    box-shadow: 0 40px 80px -28px rgba(20,23,26,.45), 0 0 0 1px rgba(20,23,26,.08);
  }
  .schermo { height: 100%; border-radius: 38px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }

  @media (max-width: 440px) {
    .telaio  { width: 100%; height: auto; min-height: 680px; border-radius: 22px; padding: 6px; box-shadow: none; }
    .schermo { border-radius: 17px; }
  }

  .h-13 { height: 3.25rem; }

  .entra { animation: entra .3s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  /* le righe entrano una dopo l'altra: dà vita senza diventare uno spettacolo */
  .scaglione > * { animation: entra .34s cubic-bezier(.2,.7,.3,1) both; }
  .scaglione > *:nth-child(1) { animation-delay: .02s }
  .scaglione > *:nth-child(2) { animation-delay: .06s }
  .scaglione > *:nth-child(3) { animation-delay: .10s }
  .scaglione > *:nth-child(4) { animation-delay: .14s }
  .scaglione > *:nth-child(5) { animation-delay: .18s }
  .scaglione > *:nth-child(n+6) { animation-delay: .22s }

  .barra-comp { display: flex; height: 34px; border-radius: 10px; overflow: hidden; background: #E6E3DB; }
  .barra-comp > span {
    display: flex; align-items: center; height: 100%; overflow: hidden;
    padding-inline: 10px; white-space: nowrap; flex-shrink: 0;

    animation: apri-barra .6s cubic-bezier(.2,.7,.3,1);
  }
  .barra-resto { flex: 1; animation: none; }
  /* nessun "to": il valore finale è quello che l'elemento ha già */
  @keyframes apri-barra { from { width: 0; } }

  .colonna { animation: cresci-colonna .55s cubic-bezier(.2,.7,.3,1); }
  @keyframes cresci-colonna { from { height: 0; } }

  /* filo della cronologia: 24px di padding + 6px di mezzo pallino */
  .filo { position: relative; }
  .filo::before {
    content: ""; position: absolute; left: 30px; top: 0; bottom: 0;
    width: 1px; margin-left: -0.5px; background: #E0DDD4;
  }
  .filo:first-child::before { top: 28px; }
  .filo:last-child::before  { bottom: calc(100% - 28px); }
  .filo:first-child:last-child::before { display: none; }

  /* filo verticale accanto alla voce di menu attiva */
  .voce-menu { position: relative; }
  .voce-menu[data-attiva="1"]::before {
    content: ""; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 99px; background: #1E3A5F;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// useGrouping "always": in italiano 8670 resterebbe senza punto, e accanto a 36.802 si legge male
const NUM = { useGrouping: "always" };
// spazio unificatore: il simbolo e l'unità non si staccano mai dalla cifra
const euro = n => "€ " + n.toLocaleString("it-IT", { ...NUM, minimumFractionDigits: 2, maximumFractionDigits: 2 });
const euroTondo = n => "€ " + Math.round(n).toLocaleString("it-IT", NUM);
const ore = n => n.toLocaleString("it-IT", { ...NUM, maximumFractionDigits: 1 }) + " h";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const cliente  = id => S.clienti.find(c => c.id === id);
const commessa = id => S.commesse.find(m => m.id === id);
const cantiere = id => S.cantieri.find(k => k.id === id);
const persona  = id => S.persone.find(p => p.id === id);
const ordine   = id => S.ordini.find(o => o.id === id);
const fornitore= id => S.fornitori.find(f => f.id === id);
const tipologia= id => S.tipologie.find(t => t.id === id);
const articolo = cod => S.catalogo.find(a => a.codice === cod);

const cantieriDi   = mId => S.cantieri.filter(k => k.commessaId === mId);
const commesseDi   = cId => S.commesse.filter(m => m.clienteId === cId);
const ordiniDi     = mId => S.ordini.filter(o => o.commessaId === mId);
const costiDi      = mId => S.costiExtra.filter(x => x.commessaId === mId);
const oreDi        = mId => S.ore.filter(h => h.commessaId === mId);
const oreCantiere  = kId => S.ore.filter(h => h.cantiereId === kId);
const docDi        = mId => S.documenti.filter(d => d.commessaId === mId);
const squadraDi    = kId => S.assegnazioni.filter(a => a.cantiereId === kId).map(a => persona(a.personaId)).filter(Boolean);
const cantieriDiCapo = pId => S.cantieri.filter(k => k.capoId === pId);

const totOrdine = o => o.righe.reduce((s, r) => s + r.qta * r.prezzo, 0);

const iniziali = nome => nome.split(" ").slice(0, 2).map(p => p[0]).join("").toUpperCase();

/* Il bilancino: l'unico posto dove si calcola l'economia di una commessa.
   Tutte le viste che mostrano numeri chiamano questa. */
function bilancio(mId) {
  const m = commessa(mId);
  const ordiniTot = ordiniDi(mId).reduce((s, o) => s + totOrdine(o), 0);
  const extraTot  = costiDi(mId).filter(x => x.stato === "registrato").reduce((s, x) => s + x.importo, 0);
  const extraBozza= costiDi(mId).filter(x => x.stato === "bozza").reduce((s, x) => s + x.importo, 0);

  // ore per tipologia: storico consuntivato + registrazioni vive
  const perTipo = {};
  S.oreStorico.filter(r => r.commessaId === mId).forEach(r => { perTipo[r.tipologiaId] = (perTipo[r.tipologiaId] || 0) + r.ore; });
  oreDi(mId).forEach(h => {
    const p = persona(h.personaId);
    if (!p) return;
    perTipo[p.tipologiaId] = (perTipo[p.tipologiaId] || 0) + h.ore;
  });

  const oreTot  = Object.values(perTipo).reduce((s, v) => s + v, 0);
  const manodopera = Object.entries(perTipo).reduce((s, [tId, h]) => s + h * (tipologia(tId)?.costo || 0), 0);

  const costiTracciati = ordiniTot + extraTot + (S.valorizzaOre ? manodopera : 0);
  return {
    ricavo: m.ricavo, ordiniTot, extraTot, extraBozza, oreTot, perTipo, manodopera,
    costiTracciati,
    margine: m.ricavo - costiTracciati,
    percentuale: m.ricavo ? (m.ricavo - costiTracciati) / m.ricavo * 100 : 0,
  };
}

/* la barra che scompone i costi sul ricavo: firma visiva della demo */
function barraBilancio(b, { etichette = true } = {}) {
  const base = Math.max(b.ricavo, b.costiTracciati) || 1;
  const p = v => (v / base * 100);
  const mano = S.valorizzaOre ? b.manodopera : 0;
  const pezzo = (valore, colore, nome) => {
    const larg = p(valore);
    if (larg <= 0) return "";
    const testo = etichette && larg > 9 ? `${nome} ${euroTondo(valore)}` : "";
    return `<span style="width:${larg.toFixed(2)}%;background:${colore}" title="${nome}: ${euro(valore)}">${testo}</span>`;
  };
  return `<div class="barra-comp" role="img" aria-label="Composizione dei costi sul ricavo">
    ${pezzo(b.ordiniTot, "#1E3A5F", "Ordini")}
    ${pezzo(b.extraTot, "#B26A2B", "Costi extra")}
    ${pezzo(mano, "#2F7A72", "Manodopera")}
    <span class="barra-resto"></span>
  </div>`;
}

function legendaBilancio(b) {
  const voci = [
    ["#1E3A5F", "Ordini", b.ordiniTot],
    ["#B26A2B", "Costi extra", b.extraTot],
  ];
  if (S.valorizzaOre) voci.push(["#2F7A72", "Manodopera", b.manodopera]);
  voci.push(["#E6E3DB", "Margine", b.margine]);
  return `<div class="flex flex-wrap items-center gap-x-7 gap-y-2">${voci.map(([c, n, v]) => `
    <span class="inline-flex items-center gap-2 text-[14px] text-fumo">
      <span class="w-2.5 h-2.5 rounded-[3px]" style="background:${c}"></span>${n}
      <span class="num text-inchiostro font-500">${euroTondo(v)}</span>
    </span>`).join("")}</div>`;
}

function riquadro(titolo, corpoHtml, azione = "") {
  return `<section class="card overflow-hidden">
    ${titolo ? `<header class="flex flex-wrap items-center justify-between gap-3 px-6 py-4.5 border-b border-bordo">
      <h2 class="display text-[19px] font-600">${titolo}</h2>${azione}</header>` : ""}
    ${corpoHtml}
  </section>`;
}

function vuotoCon(icona, titolo, testo, azione = "") {
  return `<div class="py-20 text-center">
    <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-carta grid place-items-center text-fumo text-[22px]"><i class="bi ${icona}"></i></div>
    <p class="display text-[20px] font-600 mb-1.5">${esc(titolo)}</p>
    <p class="text-[14.5px] text-fumo mb-6 max-w-[400px] mx-auto leading-[1.55]">${esc(testo)}</p>
    ${azione}
  </div>`;
}

function nota(testo, tono = "attesa") {
  const c = tono === "attesa" ? "bg-attesa-velo text-attesa"
          : tono === "ok"     ? "bg-ok-velo text-ok"
          : "bg-velo text-ardesia";
  const i = tono === "attesa" ? "bi-exclamation-circle" : tono === "ok" ? "bi-check-circle" : "bi-info-circle";
  return `<div class="flex items-start gap-3 px-5 py-4 rounded-2xl ${c}">
    <i class="bi ${i} text-[16px] mt-[1px] shrink-0"></i><p class="text-[14px] leading-[1.5]">${testo}</p></div>`;
}

/* contenitore scorrevole del corpo pagina */
function corpo(html, classi = "max-w-none") {
  return `<div class="flex-1 scrolla bg-carta"><div class="${classi} mx-auto px-8 lg:px-12 py-9 space-y-7 entra">${html}</div></div>`;
}

function avviso(testo, tono = "ok") {
  const c = tono === "ok" ? "bg-inchiostro text-white" : "bg-attesa text-white";
  const el = document.createElement("div");
  el.className = `${c} px-5 py-3.5 rounded-2xl text-[14px] shadow-[0_18px_40px_-18px_rgba(20,23,26,.6)] entra pointer-events-auto max-w-[380px]`;
  el.innerHTML = testo;
  $("#avvisi").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 320); }, 3400);
}

function testataCommessa(m, tab) {
  const voci = [
    ["panoramica", "Panoramica"], ["cantieri", "Cantieri"], ["ordini", "Ordini"],
    ["costi", "Costi e ore"], ["documenti", "Documenti"], ["cronologia", "Cronologia"],
  ];
  const tabs = voci.map(([k, t]) => `
    <button data-azione="tab-commessa" data-tab="${k}"
      class="px-1 h-14 text-[15.5px] font-500 border-b-2 whitespace-nowrap transition-colors ${tab === k ? "border-ardesia text-inchiostro" : "border-transparent text-fumo hover:text-inchiostro"}">${t}</button>`).join("");

  return testata({
    briciole: [{ t: "Commesse", vai: "commesse" }, { t: cliente(m.clienteId).nome, vai: "cliente", id: m.clienteId }, { t: m.nome }],
    titolo: esc(m.nome),
    sotto: `<span class="num">${m.codice}</span> · ${esc(cliente(m.clienteId).nome)} ${badge(m.stato, "ml-1.5 align-middle")}`,
    meta: [
      { k: "Responsabile", v: esc(m.responsabile) },
      { k: "Inizio", v: m.inizio, mono: true },
      { k: "Fine prevista", v: m.fine, mono: true },
    ],
    destra: pulsante(`<i class="bi bi-bar-chart-line"></i> Bilancino`, "vai", { vista: "bilancino", id: m.id }),
  }) + `<div class="shrink-0 px-8 lg:px-12 border-b border-bordo bg-superficie overflow-x-auto"><div class="flex gap-8">${tabs}</div></div>`;
}

  const b = bilancio(m.id);
  const k = cantieriDi(m.id);

  if (tab === "cantieri")   return testataCommessa(m, tab) + corpo(bloccoCantieri(m));
  if (tab === "ordini")     return testataCommessa(m, tab) + corpo(bloccoOrdiniCommessa(m));
  if (tab === "costi")      return testataCommessa(m, tab) + corpo(bloccoCostiOre(m));
  if (tab === "documenti")  return testataCommessa(m, tab) + corpo(bloccoDocumenti(m));
  if (tab === "cronologia") return testataCommessa(m, tab) + corpo(bloccoCronologia(m));

  const cantieriHtml = k.length
    ? `<ul class="divide-y divide-bordo">${k.map(x => {
        const capo = x.capoId ? persona(x.capoId) : null;
        return `<li class="flex flex-wrap items-center gap-5 px-6 py-5">
          <div class="flex-1 min-w-[180px]">
            <p class="text-[14px] font-500">${esc(x.nome)}</p>
            <p class="text-[13px] text-fumo">${esc(x.indirizzo)}</p>
          </div>
          <div class="w-28">${badge(x.stato)}</div>
          <div class="w-40">
            <p class="occhiello">Capocantiere</p>
            <p class="text-[14px] ${capo ? "" : "text-attesa"}">${capo ? esc(capo.nome) : "Da assegnare"}</p>
          </div>
          <div class="w-20">
            <p class="occhiello">Operai</p>
            <p class="num text-[14px]">${squadraDi(x.id).length}</p>
          </div>
          ${pulsante(capo ? "Apri cantiere" : "Assegna capocantiere", capo ? "vai" : "assegna-capo",
                     capo ? { vista: "cantiere", id: x.id } : { id: x.id }, capo ? "secondario" : "primario")}
        </li>`;
      }).join("")}</ul>`
    : vuotoCon("bi-cone-striped", "Questa commessa non ha ancora cantieri",
        "Un cantiere è il contesto operativo dove si assegnano le persone e si registrano le ore.",
        pulsante("Aggiungi il primo cantiere", "nuovo-cantiere", { id: m.id }));

  return testataCommessa(m, tab) + corpo(`
    ${m.attenzione ? nota(esc(m.motivoAttenzione)) : ""}
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${cifra({ etichetta: "Ricavo manuale", valore: euroTondo(b.ricavo), nota: m.notaRicavo || "inserito a mano" })}
      ${cifra({ etichetta: "Ordini", valore: euroTondo(b.ordiniTot), nota: `${ordiniDi(m.id).length} ordini` })}
      ${cifra({ etichetta: "Costi extra", valore: euroTondo(b.extraTot), nota: `${costiDi(m.id).length} voci` })}
      ${cifra({ etichetta: "Ore", valore: ore(b.oreTot), nota: S.valorizzaOre ? euroTondo(b.manodopera) + " di manodopera" : "costo da valorizzare" })}
    </div>

    ${riquadro("Composizione economica", `<div class="p-6 space-y-4">
      ${barraBilancio(b)}
      ${legendaBilancio(b)}
      <div class="flex flex-wrap items-end justify-between gap-4 pt-5 border-t border-bordo">
        <div>
          <p class="occhiello mb-1.5">Margine sul ricavo inserito</p>
          <p class="num text-[36px] font-500 leading-none ${b.margine < 0 ? "text-allarme" : "text-ok"}">${euroTondo(b.margine)}</p>
        </div>
        <p class="num text-[24px] font-500 text-fumo">${b.percentuale.toFixed(1)}%</p>
      </div>
    </div>`, `<button data-azione="vai" data-vista="bilancino" data-id="${m.id}" class="text-[13.5px] text-ardesia hover:underline">Apri il bilancino</button>`)}

    ${riquadro(`Cantieri <span class="num text-[13px] font-400 text-fumo ml-1">${k.length}</span>`, cantieriHtml,
      pulsante(`<i class="bi bi-plus-lg"></i> Aggiungi cantiere`, "nuovo-cantiere", { id: m.id }, "secondario"))}
  `);
};

/* ---------- blocco: cantieri della commessa ---------- */
function bloccoCantieri(m) {
  const k = cantieriDi(m.id);
  if (!k.length) return riquadro("Cantieri della commessa",
    vuotoCon("bi-cone-striped", "Nessun cantiere", "Aggiungi il primo cantiere per poter assegnare persone e registrare ore.",
      pulsante("Aggiungi cantiere", "nuovo-cantiere", { id: m.id })));

  return `<div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
      ${cifra({ etichetta: "Cantieri nella commessa", valore: k.length })}
      ${cifra({ etichetta: "Operai assegnati", valore: k.reduce((s, x) => s + squadraDi(x.id).length, 0) })}
      ${cifra({ etichetta: "Ore registrate", valore: ore(oreDi(m.id).reduce((s, h) => s + h.ore, 0)), nota: "questa settimana" })}
    </div>
    ${riquadro("Cantieri della commessa", `<ul class="divide-y divide-bordo">${k.map(x => {
      const capo = x.capoId ? persona(x.capoId) : null;
      const sq = squadraDi(x.id);
      return `<li class="px-6 py-5">
        <div class="flex flex-wrap items-start gap-4">
          <div class="flex-1 min-w-[200px]">
            <div class="flex items-center gap-2.5 mb-1">
              <p class="text-[15px] font-500">${esc(x.nome)}</p>${badge(x.stato)}
            </div>
            <p class="text-[13.5px] text-fumo"><i class="bi bi-geo-alt mr-1"></i>${esc(x.indirizzo)}</p>
          </div>
          <div class="w-44">
            <p class="occhiello mb-0.5">Capocantiere</p>
            <p class="text-[14.5px] ${capo ? "" : "text-attesa"}">${capo ? esc(capo.nome) : "Da assegnare"}</p>
          </div>
          <div class="w-28">
            <p class="occhiello mb-0.5">Squadra</p>
            <p class="text-[14.5px]"><span class="num">${sq.length}</span> operai</p>
          </div>
          <div class="flex gap-2">
            ${capo ? "" : pulsante("Assegna capocantiere", "assegna-capo", { id: x.id })}
            ${pulsante("Apri cantiere", "vai", { vista: "cantiere", id: x.id }, "secondario")}
          </div>
        </div>
      </li>`;
    }).join("")}</ul>`, pulsante(`<i class="bi bi-plus-lg"></i> Nuovo cantiere`, "nuovo-cantiere", { id: m.id }, "secondario"))}`;
}

/* ---------- Dettaglio cantiere ---------- */
V.cantiere = () => {
  const x = cantiere(S.ctx.id) || S.cantieri[0];
  const m = commessa(x.commessaId);
  const c = cliente(m.clienteId);
  const capo = x.capoId ? persona(x.capoId) : null;
  const sq = squadraDi(x.id);
  const oreK = oreCantiere(x.id);
  const ordK = S.ordini.filter(o => o.cantiereId === x.id);
  const docK = S.documenti.filter(d => d.cantiereId === x.id);

  const attivita = [
    ...oreK.slice(0, 3).map(h => ({ i: "bi-clock", t: "Ore registrate", d: `${persona(h.personaId).nome} ha registrato ${h.ore} ore`, q: h.data })),
    ...S.foto.filter(f => f.cantiereId === x.id).slice(0, 2).map(f => ({ i: "bi-image", t: "Foto caricata", d: f.titolo, q: f.quando })),
  ];

  return testata({
    briciole: [{ t: "Commesse", vai: "commesse" }, { t: m.nome, vai: "commessa", id: m.id }, { t: "Cantieri" }, { t: x.nome }],
    titolo: esc(x.nome),
    sotto: `${esc(m.nome)} ${badge(x.stato, "ml-1.5 align-middle")}`,
    meta: [
      { k: "Cliente", v: esc(c.nome) },
      { k: "Capocantiere", v: capo ? esc(capo.nome) : `<span class="text-attesa">Da assegnare</span>` },
      { k: "Operai", v: sq.length, mono: true },
    ],
    destra: pulsante(`<i class="bi bi-people"></i> Gestisci operai`, "gestisci-operai", { id: x.id }),
  }) + corpo(`
    <div class="grid lg:grid-cols-[1.3fr_1fr] gap-5">
      <div class="space-y-5">
        ${riquadro("Dettagli cantiere", `<dl class="divide-y divide-bordo">
          ${[["Cliente", esc(c.nome)], ["Commessa", esc(m.nome)], ["Indirizzo", esc(x.indirizzo)],
             ["Stato", badge(x.stato)], ["Capocantiere", capo ? esc(capo.nome) : `<span class="text-attesa">Da assegnare</span>`],
             ["Ore registrate", `<span class="num">${ore(oreK.reduce((s, h) => s + h.ore, 0))}</span>`],
             ["Ordini collegati", `<span class="num">${ordK.length}</span>`]]
            .map(([k2, v]) => `<div class="flex px-6 py-3.5 text-[14.5px]"><dt class="w-44 text-fumo shrink-0">${k2}</dt><dd>${v}</dd></div>`).join("")}
        </dl>`)}

        ${riquadro("Attività recente", attivita.length ? `<ul class="divide-y divide-bordo">${attivita.map(a => `
          <li class="flex items-start gap-3.5 px-6 py-4">
            <i class="bi ${a.i} text-[14px] text-fumo mt-[2px]"></i>
            <div class="flex-1 min-w-0"><p class="text-[14px] font-500">${esc(a.t)}</p><p class="text-[13px] text-fumo">${esc(a.d)}</p></div>
            <span class="num text-[12.5px] text-fumo">${esc(a.q)}</span>
          </li>`).join("")}</ul>` : vuotoCon("bi-activity", "Nessuna attività", "Le registrazioni e i caricamenti del cantiere compaiono qui."))}
      </div>

      <div class="space-y-5">
        ${riquadro(`Squadra <span class="num text-[13px] font-400 text-fumo ml-1">${sq.length}</span>`,
          sq.length ? `<ul class="divide-y divide-bordo">${sq.map(p => `
            <li class="flex items-center gap-3.5 px-6 py-4">
              <span class="w-8 h-8 rounded-full bg-velo text-ardesia grid place-items-center text-[12px] font-600">${iniziali(p.nome)}</span>
              <div class="flex-1 min-w-0"><p class="text-[14.5px] font-500 truncate">${esc(p.nome)}</p>
                <p class="text-[12.5px] text-fumo">${esc(tipologia(p.tipologiaId).nome)}</p></div>
              ${badge("assegnato")}
            </li>`).join("")}</ul>`
          : vuotoCon("bi-person-plus", "Nessun operaio assegnato", "Assegna le persone che lavorano su questo cantiere.",
              pulsante("Gestisci operai", "gestisci-operai", { id: x.id })),
          pulsante("Gestisci", "gestisci-operai", { id: x.id }, "secondario"))}

        ${riquadro("Ordini del cantiere", ordK.length ? `<ul class="divide-y divide-bordo">${ordK.map(o => `
          <li class="flex items-center gap-3.5 px-6 py-4">
            <div class="flex-1 min-w-0">
              <p class="num text-[14px] font-500">${o.numero}</p>
              <p class="text-[12.5px] text-fumo truncate">${esc(fornitore(o.fornitoreId).nome)}</p>
            </div>
            <span class="num text-[14px]">${euro(totOrdine(o))}</span>
            <button data-azione="vai" data-vista="ordine" data-id="${o.id}" class="text-ardesia text-[13px] hover:underline">Apri</button>
          </li>`).join("")}</ul>` : vuotoCon("bi-cart", "Nessun ordine", "Gli ordini associati a questo cantiere compaiono qui."))}

        ${riquadro("Documenti e foto", `<div class="p-6 space-y-4">
          ${docK.length ? `<ul class="space-y-2">${docK.map(d => `
            <li class="flex items-center gap-2.5 text-[14px]"><i class="bi bi-file-earmark text-fumo"></i>
            <span class="flex-1 truncate">${esc(d.nome)}</span><span class="num text-[12.5px] text-fumo">${d.data}</span></li>`).join("")}</ul>` : ""}
          <div class="grid grid-cols-3 gap-2">${S.foto.filter(f => f.cantiereId === x.id).map(f => `
            <figure>
              <div class="aspect-[4/3] rounded bg-gradient-to-br from-[#D9DEE4] to-[#BEC6CF] grid place-items-center text-[#8A94A0]"><i class="bi bi-image text-[18px]"></i></div>
              <figcaption class="text-[12px] text-fumo mt-1 truncate">${esc(f.titolo)}</figcaption>
            </figure>`).join("")}</div>
        </div>`)}
      </div>
    </div>
  `);
};

/* ---------- Elenco cantieri (globale) ---------- */
V.cantieri = () => {
  const righe = S.cantieri.map(x => {
    const m = commessa(x.commessaId);
    const capo = x.capoId ? persona(x.capoId) : null;
    return `<tr class="riga-tab">
      <td class="px-6 py-4"><p class="font-500">${esc(x.nome)}</p><p class="text-[12.5px] text-fumo">${esc(x.indirizzo)}</p></td>
      <td class="px-6 py-4 text-fumo">${esc(m.nome)}</td>
      <td class="px-6 py-4">${badge(x.stato)}</td>
      <td class="px-6 py-4 ${capo ? "" : "text-attesa"}">${capo ? esc(capo.nome) : "Da assegnare"}</td>
      <td class="px-6 py-4 num text-right">${squadraDi(x.id).length}</td>
      <td class="px-6 py-4 num text-right text-fumo">${ore(oreCantiere(x.id).reduce((s, h) => s + h.ore, 0))}</td>
      <td class="px-6 py-4 text-right">${pulsante("Apri", "vai", { vista: "cantiere", id: x.id }, "secondario")}</td>
    </tr>`;
  });

  return testata({ titolo: "Cantieri", sotto: `${S.cantieri.length} cantieri su ${S.commesse.length} commesse` })
    + corpo(riquadro("", `<div class="overflow-x-auto">${tabella({
        colonne: [{ t: "Cantiere" }, { t: "Commessa" }, { t: "Stato" }, { t: "Capocantiere" },
                  { t: "Operai", destra: true }, { t: "Ore settimana", destra: true }, { t: "", destra: true }],
        righe,
      })}</div>`));
};

/* ---------- blocco: ordini della commessa ---------- */
function bloccoOrdiniCommessa(m) {
  const lista = ordiniDi(m.id).filter(o => !S.ctx.statoOrdine || o.stato === S.ctx.statoOrdine);
  const tutti = ordiniDi(m.id);

  if (!tutti.length) return riquadro("Ordini",
    vuotoCon("bi-cart", "Nessun ordine ancora associato", "Qui si raccolgono gli ordini di acquisto collegati a questa commessa.",
      pulsante("Nuovo ordine", "nuovo-ordine", { id: m.id })));

  const righe = lista.map(o => `<tr class="riga-tab">
    <td class="px-6 py-4"><p class="num font-500">${o.numero}</p><p class="num text-[12.5px] text-fumo">${o.data}</p></td>
    <td class="px-6 py-4">${esc(cantiere(o.cantiereId)?.nome || "—")}</td>
    <td class="px-6 py-4 text-fumo">${esc(fornitore(o.fornitoreId).nome)}</td>
    <td class="px-6 py-4">${o.tag.map(tag).join(" ")}</td>
    <td class="px-6 py-4 num text-right">${euro(totOrdine(o))}</td>
    <td class="px-6 py-4">${badge(o.stato)}</td>
    <td class="px-6 py-4">${badge(o.erp)}</td>
    <td class="px-6 py-4 text-right">${pulsante("Apri", "vai", { vista: "ordine", id: o.id }, "secondario")}</td>
  </tr>`);

  const filtri = ["", "creato", "confermato", "in attesa"].map(s => `
    <button data-azione="filtro-stato-ordine" data-stato="${s}"
      class="h-8 px-3 rounded text-[13.5px] font-500 border transition-colors ${(S.ctx.statoOrdine || "") === s ? "bg-ardesia text-white border-ardesia" : "bg-superficie border-bordo text-fumo hover:border-fumo"}">
      ${s === "" ? "Tutti gli stati" : s[0].toUpperCase() + s.slice(1)}</button>`).join("");

  return `<div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap gap-2">${filtri}</div>
      ${pulsante(`<i class="bi bi-plus-lg"></i> Nuovo ordine`, "nuovo-ordine", { id: m.id })}
    </div>
    ${riquadro(`${lista.length} ordini <span class="num text-[13px] font-400 text-fumo ml-1">${euro(lista.reduce((s, o) => s + totOrdine(o), 0))}</span>`,
      `<div class="overflow-x-auto">${tabella({
        colonne: [{ t: "Ordine" }, { t: "Cantiere" }, { t: "Fornitore" }, { t: "Classificazione" },
                  { t: "Totale", destra: true }, { t: "Stato" }, { t: "ERP" }, { t: "", destra: true }],
        righe, vuoto: "Nessun ordine con questo stato",
      })}</div>`)}`;
}

/* ---------- Coda globale ordini ---------- */
V["coda-ordini"] = () => {
  const fStato = S.ctx.fStato || "";
  const fCommessa = S.ctx.fCommessa || "";
  const fFornitore = S.ctx.fFornitore || "";
  const lista = S.ordini.filter(o =>
    (!fStato || o.stato === fStato) &&
    (!fCommessa || o.commessaId === fCommessa) &&
    (!fFornitore || o.fornitoreId === fFornitore));
  const daControllare = S.ordini.filter(o => o.erp === "non inviato" || o.stato === "in attesa");

  const sel = (nome, valore, opzioni, etichetta) => `
    <div>
      <label class="block text-[12px] tracking-[0.07em] uppercase text-fumo mb-1">${etichetta}</label>
      <select data-filtro-coda="${nome}" class="h-11 px-3.5 bg-superficie border border-bordo rounded-2xl text-[14px] focus:border-ardesia-2 outline-none min-w-[170px]">
        ${opzioni.map(([v, t]) => `<option value="${v}" ${v === valore ? "selected" : ""}>${esc(t)}</option>`).join("")}
      </select>
    </div>`;

  const righe = lista.map(o => {
    const m = commessa(o.commessaId);
    return `<tr class="riga-tab">
      <td class="px-6 py-4 num font-500">${o.numero}</td>
      <td class="px-6 py-4"><p class="text-[14px]">${esc(m.nome)}</p><p class="num text-[12.5px] text-fumo">${m.codice}</p></td>
      <td class="px-6 py-4 text-fumo">${esc(cantiere(o.cantiereId)?.nome || "—")}</td>
      <td class="px-6 py-4 text-fumo">${esc(fornitore(o.fornitoreId).nome)}</td>
      <td class="px-6 py-4 num text-right">${euro(totOrdine(o))}</td>
      <td class="px-6 py-4">${badge(o.stato)}</td>
      <td class="px-6 py-4">${badge(o.erp)}</td>
      <td class="px-6 py-4 num text-right text-fumo text-[13.5px]">${o.data}</td>
      <td class="px-6 py-4 text-right">${pulsante("Apri ordine", "vai", { vista: "ordine", id: o.id }, "secondario")}</td>
    </tr>`;
  });

  return testata({
    briciole: [{ t: "Ordini" }, { t: "Coda globale" }],
    titolo: "Ordini",
    sotto: "Vista trasversale su tutte le commesse, per le attività amministrative e le eccezioni.",
  }) + corpo(`
    <div class="flex flex-wrap items-end gap-3">
      ${sel("fStato", fStato, [["", "Tutti gli stati"], ["creato", "Creato"], ["confermato", "Confermato"], ["in attesa", "In attesa"]], "Stato")}
      ${sel("fCommessa", fCommessa, [["", "Tutte le commesse"], ...S.commesse.map(m => [m.id, m.nome])], "Commessa")}
      ${sel("fFornitore", fFornitore, [["", "Tutti i fornitori"], ...S.fornitori.map(f => [f.id, f.nome])], "Fornitore")}
      <button data-azione="azzera-filtri" class="h-11 px-4 bg-superficie border border-bordo rounded-2xl text-[14px] text-fumo hover:border-fumo transition-colors">Azzera filtri</button>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${cifra({ etichetta: "Ordini", valore: S.ordini.length })}
      ${cifra({ etichetta: "Richiedono attenzione", valore: daControllare.length, nota: "non inviati o in attesa", tono: daControllare.length ? "allarme" : "" })}
      ${cifra({ etichetta: "Valore ordinato", valore: euroTondo(S.ordini.reduce((s, o) => s + totOrdine(o), 0)) })}
      ${cifra({ etichetta: "Fornitori", valore: new Set(S.ordini.map(o => o.fornitoreId)).size })}
    </div>

    ${riquadro(`${lista.length} ordini`, `<div class="overflow-x-auto">${tabella({
      colonne: [{ t: "Ordine" }, { t: "Commessa" }, { t: "Cantiere" }, { t: "Fornitore" },
                { t: "Totale", destra: true }, { t: "Stato" }, { t: "ERP" }, { t: "Data", destra: true }, { t: "", destra: true }],
      righe, vuoto: "Nessun ordine con questi filtri",
    })}</div>`)}
  `);
};

/* ---------- Nuovo ordine: catalogo e composizione ---------- */
V["nuovo-ordine"] = () => {
  const bo = S.bozzaOrdine;
  const m = commessa(bo.commessaId);
  const passo = bo.passo || 1;

  const passi = [["Articoli", 1], ["Fornitore", 2], ["Riepilogo", 3]].map(([t, n]) => `
    <div class="flex items-center gap-2">
      <span class="w-6 h-6 rounded-full grid place-items-center text-[12.5px] font-600 num
        ${passo > n ? "bg-ok text-white" : passo === n ? "bg-ardesia text-white" : "bg-carta text-fumo border border-bordo"}">
        ${passo > n ? '<i class="bi bi-check text-[14px]"></i>' : n}</span>
      <span class="text-[13.5px] ${passo >= n ? "font-500" : "text-fumo"}">${t}</span>
    </div>`).join(`<span class="w-8 h-px bg-bordo"></span>`);

  const subtotale = bo.righe.reduce((s, r) => s + r.qta * r.prezzo, 0);

  const riepilogo = `<aside class="space-y-4">
    ${riquadro("Riepilogo ordine", `<div class="p-6 space-y-4">
      <div>
        <p class="occhiello mb-0.5">Commessa</p>
        <p class="text-[14.5px] font-500">${esc(m.nome)}</p>
      </div>
      <div>
        <p class="occhiello mb-0.5">Cantiere</p>
        <p class="text-[14.5px]">${esc(cantiere(bo.cantiereId)?.nome || "—")}</p>
      </div>
      <div>
        <p class="occhiello mb-1">Fornitore</p>
        <select data-campo-bozza="fornitoreId" class="w-full h-11 px-3.5 bg-superficie border border-bordo rounded-2xl text-[14px] focus:border-ardesia-2 outline-none">
          <option value="">Da scegliere</option>
          ${S.fornitori.map(f => `<option value="${f.id}" ${f.id === bo.fornitoreId ? "selected" : ""}>${esc(f.nome)}</option>`).join("")}
        </select>
      </div>
      <div class="pt-3 border-t border-bordo">
        <p class="occhiello mb-2">Articoli selezionati</p>
        ${bo.righe.length ? `<ul class="space-y-2">${bo.righe.map((r, i) => {
          const a = articolo(r.codice);
          return `<li class="flex items-start gap-2 text-[13.5px]">
            <div class="flex-1 min-w-0">
              <p class="truncate">${esc(a.nome)}</p>
              <p class="num text-[12px] text-fumo">${a.codice} · ${r.qta} ${a.unita}</p>
            </div>
            <span class="num">${euro(r.qta * r.prezzo)}</span>
            <button data-azione="togli-riga" data-i="${i}" class="text-fumo hover:text-allarme" title="Togli"><i class="bi bi-x-lg text-[12px]"></i></button>
          </li>`;
        }).join("")}</ul>` : `<p class="text-[13.5px] text-fumo">Nessun articolo, cercalo nel catalogo.</p>`}
      </div>
      <div class="flex items-baseline justify-between pt-3 border-t border-bordo">
        <span class="text-[14px] text-fumo">Totale ordine</span>
        <span class="num text-[19px] font-500">${euro(subtotale)}</span>
      </div>
      ${S.parametri.sogliaOrdineEccezionale === null
        ? nota("Nessuna soglia di approvazione è ancora stata fissata: si decide con il cliente.")
        : subtotale > S.parametri.sogliaOrdineEccezionale
          ? nota(`Sopra la soglia di ${euroTondo(S.parametri.sogliaOrdineEccezionale)}: l'ordine richiede approvazione.`)
          : ""}
      <div class="space-y-2">
        <button data-azione="conferma-ordine" ${(!bo.righe.length || !bo.fornitoreId) ? "disabled" : ""}

        <button data-azione="vai" data-vista="commessa" data-id="${m.id}" data-tab="ordini"
          class="w-full h-12 rounded-xl text-[15px] font-500 bg-superficie border border-bordo hover:border-bordo-2 hover:bg-carta transition-all">Salva come bozza</button>
      </div>
      <p class="text-[12.5px] text-fumo">L'ordine viene registrato nella commessa e conteggiato nel bilancino.</p>
    </div>`)}
  </aside>`;

  const q = (S.ctx.qCat || "").toLowerCase();
  const cat = S.ctx.catCat || "";
  const risultati = S.catalogo.filter(a => a.stato === "attivo"
    && (!q || a.nome.toLowerCase().includes(q) || a.codice.toLowerCase().includes(q))
    && (!cat || a.categoria === cat));
  const categorie = [...new Set(S.catalogo.map(a => a.categoria))];

  const ricerca = `${riquadro("Cerca nel catalogo", `<div class="p-6 space-y-4">
      <div class="flex flex-wrap gap-2.5">
        <div class="relative flex-1 min-w-[220px]">
          <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-[14px] text-fumo"></i>
          <input data-filtro="catalogo" value="${esc(S.ctx.qCat || "")}" placeholder="Cerca per descrizione o codice…"
            class="w-full h-11 pl-11 pr-4 bg-superficie border border-bordo rounded-2xl text-[14.5px] focus:border-ardesia-2 outline-none">
        </div>
        <select data-filtro-categoria class="h-11 px-3.5 bg-superficie border border-bordo rounded-2xl text-[14px] focus:border-ardesia-2 outline-none">
          <option value="">Tutte le categorie</option>
          ${categorie.map(x => `<option value="${esc(x)}" ${x === cat ? "selected" : ""}>${esc(x)}</option>`).join("")}
        </select>
      </div>
      <p class="text-[13px] text-fumo"><span class="num">${risultati.length}</span> articoli su ${S.catalogo.length} in catalogo</p>
    </div>`)}

    ${riquadro("Risultati", risultati.length ? `<ul class="divide-y divide-bordo">${risultati.map(a => `
      <li class="flex flex-wrap items-center gap-4 px-6 py-4">
        <div class="w-9 h-9 rounded bg-carta grid place-items-center text-fumo shrink-0"><i class="bi bi-box-seam text-[15px]"></i></div>
        <div class="flex-1 min-w-[160px]">
          <p class="text-[14.5px] font-500">${esc(a.nome)}</p>
          <p class="num text-[12.5px] text-fumo">${a.codice} · ${esc(a.categoria)}</p>
        </div>
        <div class="w-28 text-right">
          <p class="num text-[14.5px]">${euro(a.prezzo)}</p>
          <p class="text-[12px] text-fumo">per ${esc(a.unita)}</p>
        </div>
        <form data-aggiungi-articolo="${a.codice}" class="flex items-center gap-2">
          <input name="qta" type="number" min="1" step="1" value="1" aria-label="Quantità"
            class="num w-20 h-8 px-2 bg-superficie border border-bordo rounded text-[14px] text-right focus:border-ardesia-2 outline-none">
          <button type="submit" class="h-8 px-3 rounded text-[14px] font-500 bg-ardesia text-white hover:bg-inchiostro transition-colors">Aggiungi</button>
        </form>
      </li>`).join("")}</ul>` : vuotoCon("bi-search", "Nessun articolo", "Prova con un altro testo o cambia categoria."))}`;

  return testata({
    briciole: [{ t: "Commesse", vai: "commesse" }, { t: m.nome, vai: "commessa", id: m.id }, { t: "Nuovo ordine" }],
    titolo: "Nuovo ordine",
    sotto: `${esc(cliente(m.clienteId).nome)} · cantiere ${esc(cantiere(bo.cantiereId)?.nome || "—")}`,
    destra: `<div class="flex items-center gap-2">${passi}</div>`,
  }) + corpo(`<div class="grid lg:grid-cols-[1.5fr_1fr] gap-5 items-start"><div class="space-y-5">${ricerca}</div>${riepilogo}</div>`);
};

/* ---------- Dettaglio ordine ---------- */
V.ordine = () => {

  const m = commessa(o.commessaId);
  const tot = totOrdine(o);
  const docO = S.documenti.filter(d => d.ordineId === o.id);

  const righe = o.righe.map(r => {
    const a = articolo(r.codice);
    return `<tr class="riga-tab">

      <td class="px-6 py-4">${esc(a.nome)}</td>
      <td class="px-6 py-4 num text-right">${r.qta} ${esc(a.unita)}</td>
      <td class="px-6 py-4 num text-right">${euro(r.prezzo)}</td>

    briciole: [{ t: "Commesse", vai: "commesse" }, { t: m.nome, vai: "commessa", id: m.id }, { t: "Ordini" }, { t: o.numero }],
    titolo: `<span class="num">${o.numero}</span>`,
    sotto: `${esc(cliente(m.clienteId).nome)} · ${esc(cantiere(o.cantiereId)?.nome || "—")} · ${esc(fornitore(o.fornitoreId).nome)} ${badge(o.stato, "ml-1.5 align-middle")}`,
    meta: [{ k: "Data", v: o.data, mono: true }, { k: "Totale", v: euro(tot), mono: true }],
  }) + corpo(`
    <div class="grid lg:grid-cols-[1.5fr_1fr] gap-5 items-start">
      <div class="space-y-5">
        ${riquadro("Righe dell'ordine", `<div class="overflow-x-auto">${tabella({
          colonne: [{ t: "Codice" }, { t: "Descrizione" }, { t: "Quantità", destra: true }, { t: "Prezzo unitario", destra: true }, { t: "Totale", destra: true }],
          righe,
        })}</div>
        <div class="px-6 py-4 border-t border-bordo flex flex-wrap items-center gap-2">
          <span class="text-[12px] tracking-[0.07em] uppercase text-fumo mr-1">Classificazione</span>
          ${o.tag.map(tag).join(" ")}
        </div>`)}

        ${riquadro("Cronologia", `<ul class="divide-y divide-bordo">
          <li class="flex items-start gap-3.5 px-6 py-4">
            <span class="w-1.5 h-1.5 rounded-full bg-ok mt-[7px]"></span>
            <div class="flex-1"><p class="text-[14px] font-500">Ordine creato</p>
              <p class="text-[13px] text-fumo">Inserito dall'amministrazione</p></div>
            <span class="num text-[12.5px] text-fumo">${o.data}</span>
          </li>
          ${o.stato === "confermato" ? `<li class="flex items-start gap-3.5 px-6 py-4">
            <span class="w-1.5 h-1.5 rounded-full bg-ok mt-[7px]"></span>
            <div class="flex-1"><p class="text-[14px] font-500">Ordine confermato al fornitore</p>
              <p class="text-[13px] text-fumo">${esc(fornitore(o.fornitoreId).nome)}</p></div>
            <span class="num text-[12.5px] text-fumo">${o.data}</span>
          </li>` : ""}
          ${o.erp !== "non inviato" ? `<li class="flex items-start gap-3.5 px-6 py-4">
            <span class="w-1.5 h-1.5 rounded-full bg-ardesia-2 mt-[7px]"></span>
            <div class="flex-1"><p class="text-[14px] font-500">Trasmesso a Zucchetti</p>
              <p class="text-[13px] text-fumo">Stato: ${esc(o.erp)}</p></div>
            <span class="num text-[12.5px] text-fumo">${o.data}</span>
          </li>` : ""}
        </ul>`)}
      </div>

      <div class="space-y-5">
        ${riquadro("Riepilogo", `<div class="p-6 space-y-3">
          ${[["Totale articoli", euro(tot)], ["Sconto", euro(0)], ["IVA", "esclusa"]].map(([k, v]) => `
            <div class="flex justify-between text-[14px]"><span class="text-fumo">${k}</span><span class="num">${v}</span></div>`).join("")}
          <div class="flex justify-between items-baseline pt-2.5 border-t border-bordo">
            <span class="text-[14px] font-500">Totale ordine</span><span class="num text-[19px] font-500">${euro(tot)}</span>
          </div>
          <p class="text-[12.5px] text-fumo pt-1">Rientra nei costi tracciati della commessa.</p>
        </div>`)}

        ${riquadro("Integrazione ERP", `<div class="p-6 space-y-4">
          ${nota(`Zucchetti: <span class="font-500">${esc(o.erp)}</span>`, erpTono)}
          ${o.erp === "non inviato"
            ? `${pulsante("Prepara invio a Zucchetti", "prepara-erp", { id: o.id })}
               <p class="text-[12.5px] text-fumo">L'invio vero si configura in una fase successiva: qui si vede solo cosa partirebbe.</p>`
            : `<p class="text-[13.5px] text-fumo">L'ordine è già stato trasmesso. Contabilità e fattura restano su Zucchetti.</p>`}
        </div>`)}

        ${riquadro("Documenti dell'ordine", docO.length ? `<ul class="divide-y divide-bordo">${docO.map(d => `
          <li class="flex items-center gap-3.5 px-6 py-4">
            <i class="bi bi-file-earmark-pdf text-[15px] text-fumo"></i>
            <span class="flex-1 text-[14px] truncate">${esc(d.nome)}</span>
            <span class="num text-[12.5px] text-fumo">${d.data}</span>

          : vuotoCon("bi-paperclip", "Nessun allegato", "La fattura del fornitore si associa qui, sull'ordine."))}

/* ---------- Catalogo prodotti ---------- */
V.catalogo = () => {
  const q = (S.ctx.q || "").toLowerCase();
  const cat = S.ctx.catCat || "";
  const lista = S.catalogo.filter(a =>
    (!q || a.nome.toLowerCase().includes(q) || a.codice.toLowerCase().includes(q)) &&
    (!cat || a.categoria === cat));

  const righe = lista.map(a => `<tr class="riga-tab">
    <td class="px-6 py-4 num text-[13.5px] text-fumo">${a.codice}</td>
    <td class="px-6 py-4 font-500">${esc(a.nome)}</td>

    destra: pulsante(`<i class="bi bi-plus-lg"></i> Nuovo articolo`, "non-in-demo"),
  }) + corpo(`
    ${nota("Struttura e qualità dell'anagrafica prodotti reale si vedono dopo la firma dell'NDA. Questo catalogo è dimostrativo.")}
    <div class="flex flex-wrap gap-2.5">
      <div class="relative flex-1 min-w-[240px]">
        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-[14px] text-fumo"></i>
        <input data-filtro="catalogo-pagina" value="${esc(S.ctx.q || "")}" placeholder="Cerca per descrizione o codice…"
          class="w-full h-11 pl-11 pr-4 bg-superficie border border-bordo rounded-2xl text-[14.5px] focus:border-ardesia-2 outline-none">
      </div>
      <select data-filtro-categoria class="h-11 px-3.5 bg-superficie border border-bordo rounded-2xl text-[14px] focus:border-ardesia-2 outline-none">

      </select>
    </div>
    ${riquadro(`<span class="num">${lista.length}</span> articoli`, `<div class="overflow-x-auto">${tabella({
      colonne: [{ t: "Codice" }, { t: "Prodotto" }, { t: "Categoria" }, { t: "Unità" }, { t: "Prezzo unitario", destra: true }, { t: "Stato" }, { t: "", destra: true }],
      righe, vuoto: "Nessun articolo trovato",
    })}</div>`)}
  `);
};

/* ---------- blocco: costi extra e ore ---------- */
function bloccoCostiOre(m) {
  const b = bilancio(m.id);
  const extra = costiDi(m.id);
  const oreM = oreDi(m.id);

  const vociCosto = [
    ...ordiniDi(m.id).map(o => ({
      voce: `${fornitore(o.fornitoreId).nome}`, sotto: o.numero, tipo: "Ordine",
      importo: totOrdine(o), stato: o.stato === "in attesa" ? "in attesa" : "registrato", vai: { vista: "ordine", id: o.id },
    })),
    ...extra.map(x => ({ voce: x.tipo, sotto: x.nota || x.data, tipo: "Costo extra", importo: x.importo, stato: x.stato })),
  ];

  const righeCosto = vociCosto.map(v => `<tr class="riga-tab">
    <td class="px-6 py-4"><p class="font-500">${esc(v.voce)}</p><p class="text-[12.5px] text-fumo">${esc(v.sotto)}</p></td>
    <td class="px-6 py-4 text-fumo">${esc(v.tipo)}</td>
    <td class="px-6 py-4 num text-right">${euro(v.importo)}</td>
    <td class="px-6 py-4">${badge(v.stato)}</td>
    <td class="px-6 py-4 text-right">${v.vai ? pulsante("Apri", "vai", v.vai, "secondario") : ""}</td>
  </tr>`);

  const perTipo = Object.entries(b.perTipo).map(([tId, h]) => {
    const t = tipologia(tId);
    return `<div class="flex items-center justify-between px-6 py-3.5 text-[14px]">
      <span>${esc(t.nome)}</span>
      <span class="flex items-center gap-4">
        <span class="num text-fumo">${euro(t.costo)}/h</span>
        <span class="num font-500 w-20 text-right">${ore(h)}</span>
      </span>
    </div>`;
  }).join("");

  const ultimeOre = oreM.slice(0, 6).map(h => `<tr class="riga-tab">
    <td class="px-6 py-4">${esc(persona(h.personaId).nome)}</td>
    <td class="px-6 py-4 text-fumo">${esc(cantiere(h.cantiereId)?.nome || "—")}</td>
    <td class="px-6 py-4 num text-fumo text-[13.5px]">${h.data}</td>
    <td class="px-6 py-4 num text-right font-500">${ore(h.ore)}</td>
    <td class="px-6 py-4 text-fumo text-[13.5px]">${esc(h.nota) || "—"}</td>
    <td class="px-6 py-4">${badge(h.stato)}${h.storico.length ? `<span class="ml-1.5 text-[12px] text-ardesia" title="Rettificata"><i class="bi bi-clock-history"></i></span>` : ""}</td>
  </tr>`);

  return `<div class="grid lg:grid-cols-[1.4fr_1fr] gap-5 items-start">
    <div class="space-y-5">
      ${riquadro(`Costi <span class="num text-[13px] font-400 text-fumo ml-1">${euro(b.ordiniTot + b.extraTot)}</span>`,
        `<div class="overflow-x-auto">${tabella({
          colonne: [{ t: "Voce" }, { t: "Tipo" }, { t: "Importo", destra: true }, { t: "Stato" }, { t: "", destra: true }],
          righe: righeCosto, vuoto: "Nessun costo registrato",
        })}</div>
        <p class="px-6 py-4 text-[13.5px] text-fumo border-t border-bordo">Gli importi mostrati sono dati operativi della commessa, non scritture contabili.</p>`)}

      ${riquadro("Ultime registrazioni ore", `<div class="overflow-x-auto">${tabella({
        colonne: [{ t: "Persona" }, { t: "Cantiere" }, { t: "Data" }, { t: "Ore", destra: true }, { t: "Nota" }, { t: "Stato" }],
        righe: ultimeOre, vuoto: "Nessuna registrazione",
      })}</div>`, `<button data-azione="vai" data-vista="ore" class="text-[13.5px] text-ardesia hover:underline">Registro completo</button>`)}
    </div>

    <div class="space-y-5">
      ${riquadro("Ore registrate", `<div class="p-6 pb-0">
          <p class="occhiello mb-1">Totale ore</p>
          <p class="num text-[28px] font-500 leading-none">${ore(b.oreTot)}</p>
          ${S.valorizzaOre ? `<p class="text-[13.5px] text-fumo mt-1.5">${euroTondo(b.manodopera)} di manodopera</p>`
            : `<p class="text-[13.5px] text-attesa mt-1.5">Costo non ancora valorizzato</p>`}
        </div>
        <div class="mt-3 border-t border-bordo divide-y divide-bordo">${perTipo}</div>`)}

      ${riquadro("Nuovo costo extra", `<form id="form-costo" class="p-6 space-y-4">
        <input type="hidden" name="commessaId" value="${m.id}">
        <div>
          <label class="block text-[13.5px] font-500 mb-1.5">Tipo</label>
          <select name="tipo" class="w-full h-11 px-3.5 bg-superficie border border-bordo rounded-2xl text-[14px] focus:border-ardesia-2 outline-none">
            <option>Oneri di gestione</option><option>Smaltimento</option><option>Nolo a caldo</option>
            <option>Nolo a freddo</option><option>Trasporti</option><option>Penale ritardo fornitore</option><option>Altro</option>
          </select>
        </div>
        <div>
          <label class="block text-[13.5px] font-500 mb-1.5">Importo</label>
          <input name="importo" type="number" min="0" step="10" required placeholder="0,00"
            class="num w-full h-11 px-3.5 bg-superficie border border-bordo rounded-2xl text-[14px] text-right focus:border-ardesia-2 outline-none">
        </div>
        <div>
          <label class="block text-[13.5px] font-500 mb-1.5">Nota</label>
          <textarea name="nota" rows="2" placeholder="Descrivi il costo"
            class="w-full px-3.5 py-3 bg-superficie border border-bordo rounded-2xl text-[14px] focus:border-ardesia-2 outline-none resize-none"></textarea>
        </div>
        <button type="submit" class="w-full h-12 rounded-xl text-[15px] font-500 bg-ardesia text-white hover:bg-inchiostro active:scale-[.99] transition-all">Aggiungi costo extra</button>
      </form>`)}
    </div>
  </div>`;
}

/* ---------- Bilancino ---------- */
V.bilancino = () => {
  const m = commessa(S.ctx.id) || S.commesse[0];
  const b = bilancio(m.id);

  const componente = ({ nome, valore, ore: oreV, fonte, colore, azione, dati, sigla }) => `
    <button ${Object.entries(dati).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}
      class="card card-vivo text-left px-6 py-5 w-full group">
      <div class="flex items-center gap-2.5 mb-3">
        ${colore ? `<span class="w-3 h-3 rounded-[4px] shrink-0" style="background:${colore}"></span>` : ""}
        <p class="occhiello">${esc(nome)}</p>
        <span class="num text-[12px] text-fumo-2 ml-auto">${sigla}</span>
      </div>
      <p class="num text-[30px] font-500 leading-none ${valore === null ? "text-fumo" : ""}">${valore !== null ? euroTondo(valore) : ore(oreV)}</p>
      <p class="text-[13px] text-fumo mt-3.5 leading-[1.4] min-h-[36px]">${esc(fonte)}</p>
      <span class="inline-flex items-center gap-1.5 text-[13.5px] text-ardesia font-500 mt-2 group-hover:gap-2.5 transition-all">
        ${azione} <i class="bi bi-arrow-right text-[10px]"></i></span>
    </button>`;

  const perTipo = Object.entries(b.perTipo).map(([tId, h]) => {
    const t = tipologia(tId);
    return `<tr class="riga-tab">
      <td class="px-6 py-4">${esc(t.nome)}</td>
      <td class="px-6 py-4 num text-right text-fumo">${euro(t.costo)}/h</td>
      <td class="px-6 py-4 num text-right">${ore(h)}</td>
      <td class="px-6 py-4 num text-right font-500 ${S.valorizzaOre ? "" : "text-fumo-2"}">${euro(h * t.costo)}</td>
    </tr>`;
  });

  const quotaMargine = Math.max(0, Math.min(100, b.percentuale));

  return testata({
    briciole: [{ t: "Commesse", vai: "commesse" }, { t: m.nome, vai: "commessa", id: m.id }, { t: "Bilancino" }],

/* ---------- blocco documenti ---------- */

  const lista = tutti.filter(d => !filtro || d.destinazione === filtro);
  const icone = { pdf: "bi-file-earmark-pdf", doc: "bi-file-earmark-word", xls: "bi-file-earmark-spreadsheet" };

  const bottoni = [["", "Tutti"], ["cliente", "Cliente"], ["commessa", "Commessa"], ["cantiere", "Cantiere"], ["ordine", "Ordine"]].map(([v, t]) => `
    <button data-azione="filtro-dest" data-dest="${v}"
      class="h-8 px-3 rounded text-[13.5px] font-500 border transition-colors ${filtro === v ? "bg-ardesia text-white border-ardesia" : "bg-superficie border-bordo text-fumo hover:border-fumo"}">${t}</button>`).join("");

  const righe = lista.map(d => `<tr class="riga-tab">
    <td class="px-6 py-4"><i class="bi ${icone[d.tipo] || "bi-file-earmark"} text-[16px] text-fumo"></i></td>
    <td class="px-6 py-4 font-500">${esc(d.nome)}</td>
    <td class="px-6 py-4 num text-fumo text-[13.5px]">${d.data}</td>

      <label class="block border-2 border-dashed border-bordo rounded-lg py-7 text-center cursor-pointer hover:border-ardesia-2 transition-colors">

        <p class="text-[14px] font-500 mt-1.5">Trascina qui il file</p>
        <p class="text-[13px] text-fumo">oppure scegli dal computer</p>

      <div>

        <select name="destinazione" class="w-full h-11 px-3.5 bg-superficie border border-bordo rounded-2xl text-[14px] focus:border-ardesia-2 outline-none">

V.documenti = () => {

  return `<div class="space-y-5">

function telefono(contenuto, barra, spiega) {

function spiegazione(titolo, testo, punti = []) {

function barraMobile(voci, attiva) {

}

const VISTE_INIZIALI = { admin: "dashboard", capo: "capo-oggi", operaio: "opr-oggi" };

/* Le classi del CDN di Tailwind arrivano un frame dopo il contenuto: per quel
   frame il testo è senza stili, quindi più alto, e la barra verticale lampeggia
   a ogni cambio vista. La si tiene ferma finché gli stili non sono a posto.
   Timer e non requestAnimationFrame: in una scheda aperta in secondo piano rAF
   non scatta e lo scroll resterebbe bloccato per sempre.
   ponytail: 120ms fissi, se un giorno il rendering diventa più lento si alza */
function fermaBarra() {
  const sc = $("#vista .scrolla");
  if (!sc) return;
  sc.style.overflowY = "hidden";
  clearTimeout(fermaBarra.t);
  fermaBarra.t = setTimeout(() => { sc.style.overflowY = ""; }, 120);
}

function disegna() {
  disegnaMenu();
  const f = V[S.vista] || V[VISTE_INIZIALI[S.ruolo]];
  $("#vista").innerHTML = f();
  $("#vista").scrollTop = 0;
  fermaBarra();

  $$(".pill-ruolo").forEach(b => {
    const attivo = b.dataset.ruolo === S.ruolo;
    b.className = `pill-ruolo px-3 lg:px-4 h-9 rounded-full text-[13.5px] font-500 transition-all ${
      attivo ? "bg-ardesia text-white shadow-[0_2px_8px_-2px_rgba(30,58,95,.5)]" : "text-fumo hover:text-inchiostro"}`;
  });

  const io = S.ruolo === "admin" ? { nome: "Marco Bianchi", r: "Amministrazione" }
    : S.ruolo === "capo" ? { nome: persona(IO_CAPO).nome, r: "Capocantiere" }

  // la ricerca globale è una cosa da scrivania: sui due ruoli mobile non esiste
  $("#zona-ricerca").style.display = S.ruolo === "admin" ? "" : "none";
  $("#nome-utente").textContent = io.nome;
  $("#etichetta-ruolo").textContent = io.r;
  $("#iniziali-utente").textContent = iniziali(io.nome);
}

function vaiA(vista, ctx = {}) {
  S.vista = vista;
  S.ctx = ctx;
  disegna();
}

function cambiaRuolo(r) {
  S.ruolo = r;

document.addEventListener("submit", e => {
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));
  // f.id restituirebbe il campo name="id" del form, non l'attributo
  const modulo = f.getAttribute("id");

  if (modulo === "form-commessa") {
    e.preventDefault();
    const id = "M" + (S.commesse.length + 1);
    const n = String(S.commesse.length + 18).padStart(3, "0");
    S.commesse.push({
      id, codice: `CM-2026-${n}`, nome: d.nome, clienteId: d.clienteId, ricavo: +d.ricavo,
      notaRicavo: "", stato: d.stato, attenzione: false, motivoAttenzione: "",
      responsabile: "Marco Bianchi",
      inizio: d.inizio.split("-").reverse().join("/"), fine: d.fine.split("-").reverse().join("/"),
      agg: "Oggi, ora",
    });
    S.cronologia.unshift({ commessaId: id, quando: "Oggi, ora", chi: "Amministrazione", cosa: "Commessa creata", dettaglio: d.nome });
    vaiA("commessa", { id });
    avviso(`Commessa creata. Adesso serve almeno un cantiere.`);
    return;
  }

  if (modulo === "form-cantiere") {
    e.preventDefault();
    const id = "K" + (S.cantieri.length + 1);
    S.cantieri.push({ id, nome: d.nome, commessaId: d.commessaId, indirizzo: d.indirizzo,
      stato: "in preparazione", capoId: d.capoId || null });
    chiudiPannello();
    S.ctx = { id: d.commessaId, tab: "cantieri" };
    disegna();
    avviso(`Cantiere ${esc(d.nome)} aggiunto alla commessa`);

  }

  if (modulo === "form-capo") {
    e.preventDefault();
    cantiere(d.cantiereId).capoId = d.capoId;
    chiudiPannello(); disegna();
    avviso(`${esc(persona(d.capoId).nome)} è il capocantiere di ${esc(cantiere(d.cantiereId).nome)}`);
    return;
  }

  if (modulo === "form-costo") {
    e.preventDefault();
    S.costiExtra.push({ id: "X" + (S.costiExtra.length + 1), commessaId: d.commessaId, tipo: d.tipo,

    S.cronologia.unshift({ commessaId: d.commessaId, quando: "Oggi, ora", chi: "Amministrazione",
      cosa: "Costo extra inserito", dettaglio: `${d.tipo}, ${euro(+d.importo)}` });

    avviso(`${esc(d.tipo)} aggiunto: ${euro(+d.importo)} nel bilancino`);

    e.preventDefault();
    const m = commessa(d.commessaId);
    S.documenti.unshift({ id: "D" + (S.documenti.length + 1), nome: d.nome.endsWith(".pdf") ? d.nome : d.nome + ".pdf",
      tipo: "pdf", data: "22/09/2026", destinazione: d.destinazione,
      commessaId: m.id, clienteId: m.clienteId, cantiereId: cantieriDi(m.id)[0]?.id });
    S.cronologia.unshift({ commessaId: m.id, quando: "Oggi, ora", chi: "Amministrazione",
      cosa: "Documento caricato", dettaglio: d.nome });
    disegna();
    avviso(`Documento associato a ${esc(d.destinazione)}`);
    return;

  if (modulo === "form-ricavo") {
    e.preventDefault();
    const m = commessa(d.id);
    m.ricavo = +d.ricavo;
    m.notaRicavo = d.nota;
    chiudiPannello(); disegna();
    avviso(`Ricavo aggiornato a ${euroTondo(+d.ricavo)}`);
    return;
  }

  if (modulo === "form-tipologia") {
    e.preventDefault();
    tipologia(d.id).costo = +d.costo;
    chiudiPannello(); disegna();
    avviso(`Costo orario aggiornato a ${euro(+d.costo)}`);

  }

  if (modulo === "form-rettifica") {
    e.preventDefault();

    h.storico.unshift({ campo: "ore", prima: ore(prima), dopo: ore(+d.ore),

    h.ore = +d.ore;
    h.nota = d.nota;

  }

/* --- filtri e campi che aggiornano lo stato --- */
document.addEventListener("input", e => {
  const t = e.target;

  if (t.dataset.filtro === "clienti") { S.ctx.q = t.value; ridisegnaMantenendoFuoco(t); }
  else if (t.dataset.filtro === "catalogo") { S.ctx.qCat = t.value; ridisegnaMantenendoFuoco(t); }
  else if (t.dataset.filtro === "catalogo-pagina") { S.ctx.q = t.value; ridisegnaMantenendoFuoco(t); }
  else if (t.id === "campo-ricerca") cercaGlobale(t.value);
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.hasAttribute("data-filtro-categoria")) { S.ctx.catCat = t.value; disegna(); }
  else if (t.dataset.filtroCoda) { S.ctx[t.dataset.filtroCoda] = t.value; disegna(); }
  else if (t.dataset.filtroOre) { S.ctx[t.dataset.filtroOre] = t.value; disegna(); }
  else if (t.dataset.campoBozza) {
    S.bozzaOrdine[t.dataset.campoBozza] = t.value;
    S.bozzaOrdine.passo = t.value && S.bozzaOrdine.righe.length ? 3 : 2;
    disegna();
  }
  else if (t.dataset.param) { S.parametri[t.dataset.param] = t.value; avviso("Parametro aggiornato"); }
});

/* Il ridisegno butta via il campo che sta scrivendo: lo si rimette dov'era.
   ponytail: soluzione a una riga, basta finché le viste restano piccole. */
function ridisegnaMantenendoFuoco(campo) {
  const sel = campo.dataset.filtro;
  const pos = campo.selectionStart;
  disegna();
  const nuovo = document.querySelector(`[data-filtro="${sel}"]`);
  if (nuovo) { nuovo.focus(); nuovo.setSelectionRange(pos, pos); }
}

/* --- ricerca globale --- */
function cercaGlobale(q) {
  const box = $("#risultati-ricerca");
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.classList.add("hidden"); return; }

  const trovati = [
    ...S.commesse.filter(m => m.nome.toLowerCase().includes(q) || m.codice.toLowerCase().includes(q))
      .map(m => ({ t: m.nome, s: `Commessa · ${m.codice}`, i: "bi-folder", vista: "commessa", id: m.id })),
    ...S.clienti.filter(c => c.nome.toLowerCase().includes(q))
      .map(c => ({ t: c.nome, s: "Cliente", i: "bi-person", vista: "cliente", id: c.id })),
    ...S.cantieri.filter(k => k.nome.toLowerCase().includes(q) || k.indirizzo.toLowerCase().includes(q))
      .map(k => ({ t: k.nome, s: `Cantiere · ${commessa(k.commessaId).nome}`, i: "bi-cone-striped", vista: "cantiere", id: k.id })),
    ...S.ordini.filter(o => o.numero.toLowerCase().includes(q))
      .map(o => ({ t: o.numero, s: `Ordine · ${fornitore(o.fornitoreId).nome}`, i: "bi-receipt", vista: "ordine", id: o.id })),
  ].slice(0, 8);

  box.innerHTML = trovati.length
    ? trovati.map(r => `<button data-azione="vai" data-vista="${r.vista}" data-id="${r.id}"
        class="w-full flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-left hover:bg-carta transition-colors">
        <span class="w-9 h-9 rounded-lg bg-carta grid place-items-center text-fumo shrink-0"><i class="bi ${r.i}"></i></span>
        <div class="min-w-0"><p class="text-[14.5px] font-500 truncate">${esc(r.t)}</p>
          <p class="text-[12.5px] text-fumo truncate">${esc(r.s)}</p></div>
      </button>`).join("")
    : `<p class="px-3.5 py-5 text-[14px] text-fumo text-center">Nessun risultato</p>`;
  box.classList.remove("hidden");
}

/* ===========================================================================
   CONTROLLO
   In console: check(). Verifica che il bilancino resti coerente con le fonti,
   perché è l'unico calcolo della demo che può sbagliare in silenzio.
   =========================================================================== */
function check() {
  const b = bilancio("M1");
  const attesiOrdini = ordiniDi("M1").reduce((s, o) => s + o.righe.reduce((t, r) => t + r.qta * r.prezzo, 0), 0);
  console.assert(Math.abs(b.ordiniTot - attesiOrdini) < 0.01, "ordini: totale diverso dalla somma delle righe");
  console.assert(b.extraTot === costiDi("M1").filter(x => x.stato === "registrato").reduce((s, x) => s + x.importo, 0),
    "costi extra: le bozze non devono entrare nel totale");
  console.assert(b.margine === b.ricavo - b.costiTracciati, "margine: non torna con ricavo meno costi");

  const primaOre = b.oreTot, primaCosti = b.costiTracciati;
  S.ore.push({ id: "HTEST", personaId: "P3", commessaId: "M1", cantiereId: "K1", data: "22/09/2026", ore: 5, nota: "", stato: "definitiva", storico: [] });
  const dopo = bilancio("M1");
  console.assert(dopo.oreTot === primaOre + 5, "le ore registrate non arrivano al bilancino");
  const vecchio = S.valorizzaOre;
  S.valorizzaOre = true;
  const valorizzato = bilancio("M1");
  console.assert(valorizzato.costiTracciati > primaCosti, "con la valorizzazione attiva la manodopera deve entrare nei costi");
  S.valorizzaOre = vecchio;
  S.ore.pop();

  console.assert(bilancio("M1").oreTot === primaOre, "il controllo ha lasciato dati sporchi");
  console.log("check: fatto, guarda sopra se ci sono asserzioni fallite");
}
