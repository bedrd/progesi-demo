<style type="text/tailwindcss">
  @theme {
    --color-carta: #F6F6F6;
    --color-petrolio: #DD0000;
    --color-petrolio-scuro: #B00000;
    --color-petrolio-chiaro: #E9B4B4;
    --color-velo: #FBEAEA;
    --color-arancio: #B45309;
    --color-arancio-velo: #FEF3C7;
    --color-ambra: #8A4B08;
    --color-inchiostro: #303030;
    --color-grigio: #555555;
    --color-linea: #E2E2E2;
    --color-ok: #2E7D4F;
    --color-ok-velo: #E4F2EA;
    --color-grafite: #3A3A3A;
    --color-fumo: #CFD2D4;
    --font-display: "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
</style>
<style>
  @layer theme, base, components, utilities;
  html, body { height: 100%; }
  body { overflow: hidden; margin: 0; background: #F6F6F6; color: #303030; font-family: "Inter", system-ui, sans-serif; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
  button:not(:disabled), [role="button"]:not(:disabled), label[for], select, summary, tr.clic, input[type="checkbox"], input[type="range"] { cursor: pointer; }
  :disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid #DD0000; outline-offset: 2px; border-radius: 6px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline-color: #303030; }

  body { display: flex; flex-direction: column; height: 100dvh; }
  #app { display: flex; flex: 1 1 0; min-height: 0; overflow: hidden; flex-direction: column; }
  /* barra della demo: chi sta guardando, suggerimenti, guida. Separata dal gestionale vero */
  #barra-demo { position: relative; z-index: 20; flex: none; background: #303030; color: #fff; }
  .seg-demo { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 4px; padding: 2px; gap: 2px; }
  .seg-demo button { flex: 1 1 auto; border-radius: 3px; padding: .25rem .6rem; font-size: .75rem; font-weight: 700; color: rgba(255,255,255,.78); white-space: nowrap; transition: background-color .15s, color .15s; }
  .seg-demo button:hover { color: #fff; }
  .seg-demo button[aria-pressed="true"] { background: #fff; color: #303030; }
  .demo-btn { display: inline-flex; align-items: center; gap: .35rem; border-radius: 3px; padding: .25rem .5rem; font-size: .75rem; font-weight: 700; color: rgba(255,255,255,.85); }
  .demo-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
  .demo-btn[aria-pressed="false"] { color: rgba(255,255,255,.5); }
  #barra-demo :focus-visible { outline-color: #fff; }
  /* parole spiegate: sottolineate a puntini, la spiegazione compare al passaggio o al tocco */
  .gl { border-bottom: 1px dotted #555; cursor: help; }
  .gl:hover, .gl:focus-visible { border-bottom-style: solid; }
  #glossa { position: fixed; z-index: 80; max-width: 300px; background: #303030; color: #fff; font-size: .8125rem; line-height: 1.45; border-radius: 4px; padding: .6rem .75rem; box-shadow: 0 8px 24px rgba(0,0,0,.2); pointer-events: none; }
  #glossa strong { display: block; margin-bottom: .15rem; }
  @media (min-width: 1024px) { #app { display: grid; grid-template-columns: 256px 1fr; grid-template-rows: 100%; } }
  #app > *, #vista, #colonna { min-height: 0; min-width: 0; }
  #sidebar { display: none; }
  @media (min-width: 1024px) { #sidebar { display: flex; } }
  body.menu-aperto #sidebar { display: flex; position: fixed; top: 0; bottom: 0; left: 0; width: 272px; z-index: 40; box-shadow: 0 10px 40px rgba(0,0,0,.18); }

  /* ================= vetro liquido =================
     Sfondo rosso Progesi con luci morbide e una macchia arancione. Sopra, pannelli di vetro chiaro
     smerigliato con il bordo luminoso, angoli tondi e pillole, come il vetro dell'iPhone.
     Il rosso è il colore principale: sfondo, marchio, voce attiva e azioni. Grafici in grafite, errori e urgenze in ambra. */
  :root { --vetro: linear-gradient(160deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.78) 48%, rgba(255,255,255,.7) 100%); --vetro-forte: rgba(255,255,255,.9); --vetro-tenue: rgba(255,255,255,.5); --bordo-vetro: rgba(255,255,255,.85); --ombra-vetro: 0 1px 1px rgba(90,0,0,.06), 0 26px 50px -28px rgba(90,0,0,.6); --luce: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.3); }
  body {
    background:
      radial-gradient(26rem 20rem at 16% 20%, rgba(255,255,255,.42), transparent 70%),
      radial-gradient(34rem 26rem at 74% 26%, rgba(110,0,8,.6), transparent 70%),
      radial-gradient(42rem 30rem at 28% 88%, rgba(255,146,36,.78), transparent 66%),
      radial-gradient(30rem 24rem at 96% 96%, rgba(255,206,130,.6), transparent 70%),
      radial-gradient(36rem 30rem at 56% 62%, rgba(255,70,70,.5), transparent 70%),
      radial-gradient(22rem 18rem at 88% 58%, rgba(255,255,255,.22), transparent 70%),
      linear-gradient(155deg, #EA161E 0%, #C00000 46%, #860207 100%);
    background-attachment: fixed;
  }
  body::before, body::after { content: ''; position: fixed; z-index: 0; border-radius: 50%; filter: blur(70px); pointer-events: none; }
  body::before { width: 30rem; height: 30rem; left: -6rem; top: 34vh; background: rgba(255,200,170,.35); }

  /* pannelli */

  .rail-b[aria-current="true"] { background: #fff; color: #1F1F1F; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 16px -8px rgba(90,0,0,.45), inset 0 1px 0 #fff; }
  .rail-b[aria-current="true"] > .bi, .rail-b[aria-current="true"] > .ico { color: #DD0000; }
  .rail-t { display: none; }
  .rail-b[aria-current="true"] .rail-t { display: inline; }
  @media (min-width: 1600px) { .rail-t { display: inline; } }
  .rail-n { position: static; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; font-size: 10px; font-weight: 700; line-height: 18px; text-align: center; background: rgba(0,0,0,.08); color: #3A3A3A; }
  .rail-n.urg { background: #B45309; color: #fff; }
  @media (max-width: 1599px) { .rail-b:not([aria-current]) .rail-n { position: absolute; top: 0; right: 0; min-width: 15px; height: 15px; line-height: 15px; font-size: 9px; padding: 0 3px; } }
  @media (min-width: 1800px) { #cerca-btn { display: none !important; } }
  .tondo { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: #1F1F1F; font-size: 1.1rem; flex: none; }
  .tondo:hover { background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.5)); }
  .cerca-pill { height: 44px; min-width: 210px; background: none; box-shadow: none; }
  header .seg.liquido { padding: 4px; height: 44px; align-items: center; background: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.34)); border: 0; }
  header .seg.liquido button { height: 36px; }
  .profilo { height: 44px; width: auto; padding: 0 .65rem 0 4px; gap: .55rem; border-radius: 999px; align-items: center; }
  .profilo:hover, .profilo[aria-expanded="true"] { background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55)); }
  #avatar { width: 36px; height: 36px; box-shadow: 0 0 0 2px rgba(255,255,255,.9); }
  .profilo-menu { position: absolute; left: auto; right: 16px; top: 66px; width: 290px; z-index: 60; }
  .pagine { display: flex; gap: 8px; padding: 0 1rem 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .pagine.vuota { display: none; }
  .pagine-sez { display: flex; gap: 8px; }
  .pagine-sez[hidden] { display: none; }
  .pagine .nav-i { width: auto; flex: none; height: 40px; padding: 0 .9rem; gap: .5rem; border-radius: 999px; font-size: .875rem; color: #3A3A3A; white-space: nowrap; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.28)); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 1px rgba(255,255,255,.3), 0 0 0 .5px rgba(80,0,0,.08); backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); }
  .pagine .nav-i:hover { background: rgba(255,255,255,.75); }
  .pagine .nav-i[aria-current="page"] { background: #fff; color: #1F1F1F; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 16px -8px rgba(90,0,0,.45), inset 0 1px 0 #fff; }
  .pagine .nav-i .badge { margin-left: .15rem; }
  /* pulsanti in vetro liquido: il secondario trasparente con il riflesso, il principale rosso lucido */
  .btn-sec { background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55)); border: 0; box-shadow: inset 0 1px 0 #fff, inset 0 -1px 1px rgba(255,255,255,.4), 0 0 0 .5px rgba(80,0,0,.12), 0 6px 14px -8px rgba(90,0,0,.35); backdrop-filter: blur(10px) saturate(180%); -webkit-backdrop-filter: blur(10px) saturate(180%); }
  .btn-sec:hover { background: #fff; }
  .btn-pri { background: linear-gradient(180deg, #FF3B3B 0%, #E00000 55%, #C40000 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 6px rgba(110,0,0,.3), 0 10px 22px -10px rgba(200,0,0,.8); }
  .btn-pri:hover { background: linear-gradient(180deg, #F52E2E, #C80000); }
  .seg { background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.25)); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 .5px rgba(80,0,0,.08); }
  .card { border-radius: 26px; }
  /* numeri grandi che si adattano al riquadro: non escono mai */
  .kpi-box { container-type: inline-size; }
  .kpi-box .kpi-n { font-size: clamp(1.3rem, 14.5cqi, 2.4rem) !important; overflow: hidden; text-overflow: ellipsis; }
  .nav-i, .chip { min-width: 0; }
  @media (max-width: 1023px) {
    .barra-alta { height: 56px; }
    .titolo-barra { display: block; opacity: 0; transition: opacity .2s; }

    .marchio { height: 40px; }
    .tondo { width: 40px; height: 40px; }
    .profilo-menu { position: fixed; left: 10px; right: 10px; top: auto; bottom: 84px; width: auto; }
    .pagine { padding: 0 12px 8px; }

function stimaRiga(r, cliId) {
  const s = srv(r.serv), sim = simili(r.serv, cliId), st = stat(sim.list);

  return { s, sim, st, costoU, giusto: prezzoGiusto(costoU), resa: r.prezzo ? 1 - costoU / r.prezzo : 0 };
}
const rigaBassa = (r, cliId) => { const x = stimaRiga(r, cliId); return x.st.n > 0 && x.resa < TARGET && x.giusto > r.prezzo; };
function totPrev(p = S.prev) {
  const righe = p.righe.map(r => ({ ...r, ...stimaRiga(r, p.cli) }));
  const una = sum(righe.filter(r => !r.s.ric), r => r.qty * r.prezzo), ann = sum(righe.filter(r => r.s.ric), r => r.qty * r.prezzo);
  const lordo = una + ann, sconto = lordo * (p.sconto || 0) / 100, imp = lordo - sconto, costo = sum(righe, r => r.qty * r.costoU);
  return { una, ann, lordo, sconto, imp, iva: imp * IVA, tot: imp * (1 + IVA), marg: imp ? (imp - costo) / imp : 0 };
}
function hintRiga(r, i, cliId) {

  const basso = resa < TARGET && giusto > r.prezzo;
  const base = `${st.n} ${s.ric ? 'contratti' : 'lavori'} ${sim.f != null ? `su aziende ${FASCE[sim.f]}` : 'di questo tipo'}: ${nf(st.ore, 1)} ore in media (da ${nf(st.min)} a ${nf(st.max)}).`;
  if (!basso) return `<p class="text-xs text-grigio"><i class="bi bi-graph-up"></i> <strong>Prezzo in linea:</strong> a ${eur(r.prezzo)} ci guadagnate il ${pc(resa)}. <span class="hidden sm:inline">${base}</span></p>`;

  add('Clienti', 'clienti', CLIENTI.filter(c => has(`${c.nome} ${c.citta} ${c.piva}`)).map(c => riga('ris-cli', c.id, esc(c.nome), `${c.tipo === 'cliente' ? 'Cliente' : 'Potenziale'} · ${esc(c.citta)}`)));

  add('Fatture', 'incassi', FATT.filter(f => has(`FT ${f.n} ${f.n} ${cli(f.cli).nome}`)).map(f => riga('vai', 'incassi', `FT ${f.n} · ${esc(cli(f.cli).nome)}`, `${eur2(f.imp)} · ${f.stato === 'incassata' ? 'incassata' : 'da incassare'}`)));

  fornitori() {

    <section class="card p-4 sm:p-6 mb-5"><p class="font-display font-medium text-lg">Fattura elettronica e banca</p><div class="grid md:grid-cols-3 gap-4 mt-3 text-sm">

    <section class="card p-4 sm:p-6 mb-5"><p class="font-display font-medium text-lg">Numeri di riferimento per i margini</p>
      <div class="grid sm:grid-cols-3 gap-4 mt-4">${campo('Costo orario interno (€)', `<input type="number" min="15" max="120" step="1" value="${S.costoH}" class="campo w-full num" data-imp="costoH">`, 'Stipendio, contributi e struttura divisi per le ore lavorate.')}${campo('Sotto prezzo sotto il (%)', `<input type="number" min="5" max="80" step="1" value="${Math.round(SOGLIA * 100)}" class="campo w-full num" data-imp="soglia">`, 'Sotto questa soglia il margine diventa un allarme.')}${campo('Obiettivo di margine (%)', `<input type="number" min="10" max="90" step="1" value="${Math.round(TARGET * 100)}" class="campo w-full num" data-imp="target">`, 'Il prezzo suggerito serve a raggiungerlo.')}</div></section>

      <div class="scroll-x"><table class="tab-t impila larga min-w-[760px]"><thead><tr><th>Servizio</th><th>Tipo</th><th class="r">Prezzo di listino</th><th class="r">Ore previste</th><th class="r">Nello storico</th></tr></thead><tbody>
      ${L.map(([id, x]) => `<tr class="${x.nuovo ? 'lampo' : ''}"><td class="font-bold m-full">${esc(x.nome)}</td><td class="m-no">${x.ric ? '<span class="chip c-at">annuale</span>' : '<span class="text-xs text-grigio">una tantum</span>'}</td><td class="r" data-l="Listino €"><input type="number" min="1" step="10" value="${x.prezzo}" class="campo !py-1.5 w-28 text-right num" data-listino="prezzo" data-id="${id}" aria-label="Prezzo di listino, ${esc(x.nome)}"></td><td class="r" data-l="Ore previste"><input type="number" min="0.5" step="0.5" value="${x.orePrev}" class="campo !py-1.5 w-20 text-right num" data-listino="orePrev" data-id="${id}" aria-label="Ore previste, ${esc(x.nome)}"></td><td class="r num m-dx text-grigio" data-l="Storico">${lavori(id).length ? `${lavori(id).length} lavori` : 'nessuno'}</td></tr>`).join('')}
      </tbody></table></div></section>
    <section class="card"><div class="px-4 sm:px-6 py-4 border-b border-linea flex flex-wrap items-center gap-3"><div class="flex-1 min-w-[200px]"><p class="font-display font-medium text-lg">Utenti e ruoli</p><p class="text-sm text-grigio">Ognuno vede solo quello che gli serve. Il tecnico non vede prezzi e margini.</p></div><button class="btn btn-sec" data-a="nuovo-utente"><i class="bi bi-person-plus"></i>Invita un utente</button></div>

        <div class="scroll-x border-t min-[1400px]:border-t-0 border-linea"><table class="tab-t min-w-[360px] [&_td]:!px-2 [&_th]:!px-2"><thead><tr><th>Chi può fare cosa</th>${Object.values(RUOLI).map(r => `<th class="!text-center !text-[11px] leading-tight">${r}</th>`).join('')}</tr></thead><tbody>${PERMESSI.map(([t, ...v]) => `<tr><td>${t}</td>${v.map(x => `<td class="text-center">${x ? '<i class="bi bi-check2 text-ok text-base" aria-label="sì"></i>' : '<span class="text-[#8A8A8A]" aria-label="no">-</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      </div></section>`;
  },

  margini() {
    const P = S.perM, ids = Object.keys(SERV).filter(id => lavori(id, P).length), sel = ids.includes(S.servSel) ? S.servSel : ids[0], l = lavori(sel, P), st = stat(l), fs = perFascia(l), deb = fasciaDebole(l);
    const perTec = TEC.map(t => ({ t, ...stat(l.filter(x => x.tec === t)) })).filter(x => x.n);
    const maxOre = Math.max(...fs.filter(x => x.n).map(x => x.ore));
    return `${testata('Prezzi e margini', "State vendendo al prezzo giusto? Ogni lavoro chiuso porta le sue ore: qui diventano il margine vero di ogni servizio.")}${prova('apri il <strong>DVR</strong> e guarda le tre fasce di dipendenti. Poi sposta il costo orario.')}
    <div class="card p-5 mb-5 flex flex-wrap items-center gap-4"><label for="costoH" class="text-sm font-bold">Costo orario interno di un tecnico: <span class="num text-base" id="costoH-n">${eur(S.costoH)}</span></label>
      <input id="costoH" type="range" min="28" max="60" step="1" value="${S.costoH}" class="flex-1 min-w-[200px] accent-[#3A3A3A]"><p class="text-xs text-grigio w-full">È il vostro numero: stipendio, contributi e struttura divisi per le ore lavorate. 38 € è un valore di esempio.</p></div>
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3"><div class="seg" role="group" aria-label="Periodo">${[[12, "Quest'anno"], [6, 'Ultimi 6 mesi'], [3, 'Ultimi 3 mesi']].map(([v, t]) => `<button data-a="per-marg" data-v="${v}" aria-pressed="${P === v}">${t}</button>`).join('')}</div>${esporta('margini')}</div>
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><p class="text-sm text-grigio">${S.margDett ? 'Con ore e anno scorso.' : 'Prezzo, margine e giudizio. Clicca un servizio per il perché.'}</p><button class="btn btn-gh !py-1 !text-xs !text-grigio" data-a="marg-dett"><i class="bi bi-${S.margDett ? 'dash' : 'plus'}-square"></i>${S.margDett ? 'Meno colonne' : 'Mostra ore e anno scorso'}</button></div>
    <div class="card scroll-x mb-5"><table class="tab-t impila ${S.margDett ? 'larga min-w-[940px]' : 'min-w-[620px]'}"><thead><tr><th>Servizio</th>${S.margDett ? '<th class="r">Lavori</th><th class="r">Ore previste</th><th class="r">Ore reali, media</th>' : ''}<th class="r">Prezzo medio</th><th class="r">Margine medio</th>${S.margDett ? '<th class="r">Anno scorso</th>' : ''}<th>Giudizio</th></tr></thead><tbody>
    ${ids.map(id => { const x = stat(lavori(id, P)), [cls, t] = giudizio(id, P), oltre = x.ore > srv(id).orePrev * 1.15;
      return `<tr class="clic ${id === sel ? 'sel' : ''}" data-a="serv-sel" data-v="${id}" tabindex="0" aria-current="${id === sel}"><td class="font-bold m-full">${srv(id).nome}${srv(id).ric && !/annual/i.test(srv(id).nome) ? ' <span class="chip c-at ml-1 font-normal">annuale</span>' : ''}</td>
      ${S.margDett ? `<td class="r num m-no">${x.n}</td><td class="r num" data-l="Ore previste">${srv(id).orePrev}</td><td class="r num ${oltre ? 'text-ambra font-bold' : ''}" data-l="Ore reali">${nf(x.ore, 1)}</td>` : ''}<td class="r num ${S.margDett ? 'm-no' : ''}" data-l="Prezzo medio">${eur(x.prezzo)}</td>
      <td class="r" data-l="Margine" style="white-space:nowrap">${margCell(x.margMedio, x.pct)}</td>${S.margDett ? `<td class="r" data-l="Anno scorso" style="white-space:nowrap">${annoScorso(id, x.pct)}</td>` : ''}<td class="m-dx"><span class="chip c-${cls}">${t}</span></td></tr>`; }).join('')}
    </tbody></table></div>

    <div class="card p-4 sm:p-6">

      <div class="rounded mt-4 p-4 ${deb ? 'bg-arancio-velo border border-arancio/50 text-ambra' : 'bg-ok-velo text-ok'} text-sm">
        ${deb ? `<p><i class="bi bi-exclamation-triangle"></i> <strong>Sulle aziende ${FASCE[deb.f]} questo servizio rende il ${pc(deb.pct)}.</strong> Ci mettete ${nf(deb.ore, 1)} ore in media, vendute a ${eur(deb.prezzo)}.</p>
        <p class="mt-1">Costo medio ${eur(deb.costoMedio)} (${nf(deb.ore, 1)} ore × ${eur(S.costoH)}${srv(sel).ext ? ' più esterni' : ''}). Per tenere il ${pc(TARGET)} il prezzo giusto su questa fascia è <strong>${eur(prezzoGiusto(deb.costoMedio))}</strong>.</p>`
        : `<p><i class="bi bi-check2-circle"></i> <strong>Nessuna fascia sotto il ${pc(SOGLIA)}.</strong> ${st.pct < TARGET ? `La media è al ${pc(st.pct)}, sotto l'obiettivo del ${pc(TARGET)}: a ${eur(prezzoGiusto(st.costoMedio))} ci arrivate.` : 'Il prezzo regge sulle ore che ci mettete davvero.'}</p>`}
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
        <div><p class="text-sm font-bold mb-3">Per taglia dell'azienda cliente</p><div class="space-y-3">
          ${fs.filter(x => x.n).map(x => `<div><div class="flex items-baseline justify-between gap-2 text-sm"><span>${FASCE[x.f]} <span class="text-xs text-grigio">· ${x.n} lavori</span></span><span><span class="num">${nf(x.ore, 1)} ore</span> ${chipPct(x.pct)}</span></div><div class="barra mt-1.5"><span style="width:${Math.round(x.ore / maxOre * 100)}%"></span></div></div>`).join('')}</div></div>
        <div><p class="text-sm font-bold mb-3">Per tecnico</p><div class="space-y-2">
          ${perTec.map(x => `<div class="flex items-center justify-between gap-2 text-sm rounded bg-carta px-3.5 py-2.5"><span class="font-bold">${x.t} <span class="text-xs text-grigio font-normal">· ${x.n} lavori</span></span><span><span class="num font-bold">${nf(x.ore, 1)}</span> ore in media <span class="text-xs text-grigio whitespace-nowrap">(da ${nf(x.min)} a ${nf(x.max)})</span></span></div>`).join('')}</div>

      </div>
      <div class="scroll-x mt-6 -mx-4 sm:-mx-6 -mb-4 sm:-mb-6"><table class="tab-t impila min-w-[640px]"><thead><tr><th>Cliente</th><th class="r">Dipendenti</th><th>Tecnico</th><th class="r">Ore</th><th class="r">Prezzo</th><th class="r">Margine</th></tr></thead><tbody>

      </tbody></table></div>
    </div>`;
  },

  incassi() {
    const fatto = S.estratto === 'si', inc = sum(FATT, f => f.pagato), dub = FATT.filter(f => f.stato === 'acconto?' || f.stato === 'dubbio').length;
    const st = f => ({ aperta: f.scad < 0 ? ['ko', `Scaduta da ${gg(-f.scad)}`] : ['at', `Scade tra ${gg(f.scad)}`], incassata: ['ok', '<i class="bi bi-check2"></i>Incassata'], 'acconto?': ['ko', 'Acconto da confermare'], dubbio: ['ko', 'Da confermare'], parziale: ['bl', `Acconto registrato, restano ${eur2(resto(f))}`] }[f.stato]);
    return `${testata('Incassi', `L'estratto conto si abbina da solo alle fatture emesse, usando il numero in causale. A voi restano solo i casi dubbi.`)}${fatto ? prova('conferma il bonifico di <strong>Carpenteria Oglio</strong>: non ha il numero fattura in causale.') : prova('premi <strong>Carica l\'estratto conto</strong>.')}
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4 mb-6 scaglione">
      <div class="col-span-2 sm:col-span-1 grid">${kpi('Da incassare', eur(daIncassare()), `${FATT.filter(aperta).length} fatture aperte`)}</div>
      ${kpi('Incassato', eur(inc), fatto ? "abbinato dall'ultimo estratto" : inc ? 'registrato a mano' : 'carica un estratto', inc ? 'text-ok' : '')}

    ${fatto ? '' : `<section class="card p-5 sm:p-6 lg:p-8 mb-6 flex flex-col lg:flex-row lg:items-center gap-5"><div class="flex-1"><p class="font-display font-medium text-xl">Estratto conto di ${MESE}</p>

    <div class="flex flex-wrap items-center justify-between gap-3 mb-3"><p class="text-sm text-grigio"><i class="bi bi-receipt-cutoff"></i> Fatture emesse e non ancora incassate. Ogni incasso va da solo in prima nota.</p><div class="flex flex-wrap gap-2">${esporta('incassi')}<button class="btn btn-sec" data-a="vai" data-v="banca"><i class="bi bi-wallet2"></i>Vai alla banca</button></div></div>

      <td class="m-full m-dopo" style="min-width:260px">${m ? `<p class="mono text-xs" style="white-space:normal">${m.causale}</p><p class="num text-xs font-bold text-ok">+ ${eur2(m.imp)}</p>${m.nota && (f.stato === 'acconto?' || f.stato === 'dubbio') ? `<p class="text-xs text-grigio mt-0.5"><i class="bi bi-lightbulb"></i> ${m.nota}</p>` : ''}` : fatto ? '<span class="text-xs text-grigio">nessun movimento</span>' : ''}</td>
      <td class="m-dx"><span class="chip c-${cls}">${t}</span>${f.sollecitata ? ' <span class="chip c-bl"><i class="bi bi-send-check"></i>Sollecitata</span>' : ''}</td>
      <td class="r m-full m-dopo" style="white-space:nowrap">${f.stato === 'acconto?' ? `<button class="btn btn-pri !py-1.5" data-a="inc" data-v="${f.n}|acconto">Registra acconto</button>` : f.stato === 'dubbio' ? `<button class="btn btn-pri !py-1.5" data-a="inc" data-v="${f.n}|ok">Conferma</button>` : f.stato === 'aperta' && f.scad < 0 && !f.sollecitata ? `<button class="btn btn-sec !py-1.5" data-a="inc" data-v="${f.n}|sollecita">Sollecita</button>` : ''}${['aperta', 'parziale'].includes(f.stato) ? `<button class="btn !py-1.5 !px-2 !font-normal text-grigio hover:bg-[#EDEDED] hover:text-inchiostro" data-a="reg-incasso" data-v="${f.n}"><i class="bi bi-cash-coin"></i>Registra incasso</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="text-xs text-grigio mt-3">L'abbinamento usa il numero fattura in causale. Quando manca, propone la fattura con lo stesso cliente e lo stesso importo e chiede a voi.</p>`;
  },

  ore() {
    const diff = o => o.dich - o.timb, daG = ORE.filter(o => Math.abs(diff(o)) > 1 && !o.chiesto && !o.ok), k = S.oreMese, mn = nomeMese(k), letti = S.oreFile.timb && S.oreFile.dich;
    const testa = `${testata('Ore e timbrature', "A fine mese le ore dichiarate dai collaboratori si confrontano da sole con le timbrature. Guardate solo le righe che non tornano.")}
    <div class="card p-4 mb-5 flex flex-wrap gap-x-3 gap-y-2 items-center text-sm"><span class="chip c-pieno">Modulo opzionale</span><p class="text-grigio">Si aggiunge dopo ordini e margini. Qui vedete come funzionerà.</p></div>
    ${k ? '' : prova(letti ? 'premi <strong>Approva quelle che tornano</strong>: restano due righe su sei.' : 'carica i due file, o premi <strong>Usa i file di esempio</strong>. Poi approva quelle che tornano.')}
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4"><label class="text-sm font-bold flex items-center gap-2">Mese<select class="campo" data-ore-mese="1">${[0, 1, 2].map(i => `<option value="${i}" ${i === k ? 'selected' : ''}>${cap(nomeMese(i))}</option>`).join('')}</select></label>${letti || k ? esporta('ore') : ''}</div>`;
    if (k) return `${testa}<div class="card p-4 mb-4 flex gap-3 items-center text-sm"><i class="bi bi-check2-circle text-ok text-lg"></i><p><strong>${cap(mn)} è chiuso.</strong> Ore approvate e mandate allo studio paghe il 2 ${nomeMese(k - 1)}.</p></div>
      <div class="card scroll-x"><table class="tab-t impila min-w-[640px]"><thead><tr><th>Collaboratore</th><th class="r">Ore dichiarate</th><th class="r">Ore timbrate</th><th>Esito</th></tr></thead><tbody>${ORE.map((o, i) => { const h = o.timb - 4 * k + (i % 3) * 2; return `<tr><td class="font-bold m-full">${o.nome}</td><td class="r num" data-l="Dichiarate">${nf(h, 1)}</td><td class="r num" data-l="Timbrate">${nf(h, 1)}</td><td class="m-dx"><span class="chip c-ok"><i class="bi bi-check2"></i>Approvate</span></td></tr>`; }).join('')}</tbody></table></div>`;
    if (!letti) return `${testa}<section class="card p-4 sm:p-6"><p class="font-display font-medium text-lg">I due file di ${mn}</p><p class="text-sm text-grigio">Gli stessi che oggi il vostro socio confronta a mano, così come escono.</p>
      <div class="grid md:grid-cols-2 gap-3 mt-4">${[['timb', 'Timbrature', "L'export del software del timbratore"], ['dich', 'Ore dichiarate', 'Il file con le ore dei collaboratori']].map(([f, t, d]) => `<label class="flex items-center gap-3 rounded border border-dashed ${S.oreFile[f] ? 'border-grafite bg-carta' : 'border-[#BDBDBD]'} p-4 cursor-pointer hover:border-grafite transition-colors"><i class="bi ${S.oreFile[f] ? 'bi-file-earmark-check text-ok' : 'bi-upload text-grigio'} text-2xl"></i><span class="flex-1 min-w-0"><span class="block font-bold text-sm">${t}</span><span class="block text-xs text-grigio truncate">${S.oreFile[f] ? esc(S.oreFile[f]) : d}</span></span><span class="text-xs underline text-grigio">${S.oreFile[f] ? 'cambia' : 'scegli'}</span><input type="file" class="sr-only" data-ore-file="${f}" accept=".xls,.xlsx,.csv,.txt"></label>`).join('')}</div>
      <div class="flex flex-wrap items-center gap-3 mt-4"><button class="btn btn-sec" data-a="ore-esempio"><i class="bi bi-files"></i>Usa i file di esempio</button><p class="text-xs text-grigio">Excel o CSV. Il formato esatto del vostro timbratore si verifica in analisi.</p></div></section>`;
    return `${testa}
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4"><p class="text-sm text-grigio">${cap(mn)}: ${ORE.length} collaboratori, tolleranza di un'ora. <button class="underline underline-offset-2" data-a="ore-file-via">Cambia i file</button></p><button class="btn btn-pri" data-a="ore-ok" ${ORE.every(o => o.ok || Math.abs(diff(o)) > 1) ? 'disabled' : ''}><i class="bi bi-check2-all"></i>Approva quelle che tornano</button></div>
    <div class="card scroll-x"><table class="tab-t impila larga min-w-[720px]"><thead><tr><th>Collaboratore</th><th class="r">Ore dichiarate</th><th class="r">Ore timbrate</th><th class="r">Differenza</th><th>Esito</th><th></th></tr></thead><tbody>
    ${ORE.map((o, i) => { const d = diff(o), ko = Math.abs(d) > 1;
      return `<tr><td class="font-bold m-full">${o.nome}</td><td class="r num" data-l="Dichiarate">${nf(o.dich, 1)}</td><td class="r num" data-l="Timbrate">${nf(o.timb, 1)}</td><td class="r num ${ko ? 'text-ambra font-bold' : ''}" data-l="Differenza">${d > 0 ? '+' : ''}${nf(d, 1)}</td>
      <td class="m-dx">${o.ok ? '<span class="chip c-ok"><i class="bi bi-check2"></i>Approvate</span>' : o.chiesto ? '<span class="chip c-bl"><i class="bi bi-send-check"></i>Chiesto chiarimento</span>' : ko ? '<span class="chip c-ko">Non torna</span>' : '<span class="chip c-at">Torna</span>'}</td>
      <td class="r m-full">${ko && !o.chiesto && !o.ok ? `<button class="btn btn-sec !py-1.5" data-a="ore-chiedi" data-v="${i}">Chiedi chiarimento</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="text-xs text-grigio mt-3">${daG.length ? `${daG.length} ${pl(daG.length, 'riga da guardare', 'righe da guardare')} invece di ${ORE.length}.` : 'Niente da guardare.'} Poi la verifica finale resta vostra: il file delle ore approvate va allo studio paghe così com'è.</p>`;
  },

  tecnico() {
    const miei = ORDINI.filter(o => o.tec === 'Paolo' && o.stato === 'assegnato').sort((a, b) => (a.data ?? 99) - (b.data ?? 99)), fatti = ORDINI.filter(o => o.tec === 'Paolo' && o.chiusoOra);
    return `<div class="card p-4 mb-5 flex gap-3 items-center text-sm"><i class="bi bi-eye text-grafite text-lg"></i><p><strong>Questo è quello che vede Paolo, anche dal telefono.</strong> I suoi lavori e basta: niente prezzi, niente margini.</p></div>
    ${prova('premi <strong>Ho finito</strong> sul DVR di Cascina Rosa, lascia 6 ore e il documento allegato, poi chiudi. Torna su <strong>Direzione</strong> e apri Prezzi e margini.')}
    <h1 class="font-display font-medium text-[1.75rem] sm:text-[2.1rem] leading-tight mb-1.5">Ciao Paolo</h1><p class="text-grigio mb-4">${miei.length ? `${pl(miei.length, 'Hai un lavoro aperto', `Hai ${miei.length} lavori aperti`)}. Quando finisci, una riga sola: quante ore ci hai messo.` : 'Nessun lavoro aperto.'}</p>
    ${miei.length ? `<div class="card mb-5"><p class="px-4 sm:px-5 py-3 border-b border-linea text-sm font-bold"><i class="bi bi-calendar-week"></i> I prossimi giorni</p><ul class="divide-y divide-[#EEEEEE]">${miei.map(o => `<li class="px-4 sm:px-5 py-2.5 flex items-center gap-3 text-sm"><span class="w-24 shrink-0 font-bold">${cap(quandoLav(o.data))}</span><span class="min-w-0 truncate">${srv(o.serv).nome.split(' · ')[0]} · ${esc(cli(o.cli).nome)}</span></li>`).join('')}</ul></div>` : ''}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 scaglione">
      ${miei.map(o => { const s = srv(o.serv), c = cli(o.cli), fatte = sumG(o);
        return `<div class="card p-5"><p class="font-display font-medium text-lg">${s.nome}</p><p class="text-sm text-grigio">${esc(c.nome)} · ${c.dip} dipendenti</p>
        <p class="text-sm mt-2"><i class="bi bi-calendar3 text-grigio"></i> ${cap(quandoLav(o.data))} · previste ${s.orePrev} ore</p>
        <p class="text-sm mt-1"><i class="bi bi-geo-alt text-grigio"></i> ${esc(indirizzo(c))} · <a class="underline underline-offset-2" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(indirizzo(c))}" target="_blank" rel="noopener">Apri in Mappe</a></p>
        ${c.referenti[0] ? `<p class="text-sm mt-1"><i class="bi bi-person text-grigio"></i> ${esc(c.referenti[0].nome)}${c.referenti[0].tel ? ` · <span class="num">${esc(c.referenti[0].tel)}</span>` : ''}</p>` : ''}
        ${o.note ? `<p class="text-sm mt-3 rounded bg-carta px-3 py-2"><i class="bi bi-chat-left-text text-grigio"></i> ${esc(o.note)}</p>` : ''}
        ${fatte ? `<p class="text-sm mt-3"><strong>${oreN(fatte)}</strong> segnate in ${o.giornate.length} ${pl(o.giornate.length, 'giornata', 'giornate')}</p>` : ''}
        ${S.chiudi === o.id ? `<div class="mt-4 rounded bg-carta p-4 entra"><label for="ore-${o.id}" class="text-sm font-bold">Quante ore ci hai messo in tutto?</label><div class="flex flex-wrap gap-2 mt-2"><input id="ore-${o.id}" type="number" min="0.5" step="0.5" value="${o.id === 5 && !fatte ? 6 : fatte || s.orePrev}" class="campo w-24 num"></div>
          <p class="text-sm font-bold mt-4">Documento consegnato al cliente</p>
          <label class="mt-1.5 flex items-center gap-2.5 rounded border border-dashed border-[#BDBDBD] bg-white px-3 py-2.5 text-sm cursor-pointer hover:border-grafite transition-colors"><i class="bi bi-paperclip text-lg"></i><span id="doc-${o.id}" class="flex-1 min-w-0 truncate">${S.doc || docDefault(o)}</span><span class="text-xs text-grigio underline">cambia</span><input type="file" class="sr-only" data-doc="${o.id}" accept=".pdf,.doc,.docx,image/*"></label>
          <p class="text-xs text-grigio mt-1.5">Dal telefono si può anche fotografare il verbale firmato.</p>
          <div class="flex flex-wrap gap-2 mt-4"><button class="btn btn-pri" data-a="chiudi" data-v="${o.id}"><i class="bi bi-check2"></i>Chiudi il lavoro</button><button class="btn btn-gh" data-a="chiudi-apri" data-v="">Annulla</button></div></div>`
        : `<div class="flex flex-wrap items-center gap-2 mt-4"><button class="btn btn-pri" data-a="chiudi-apri" data-v="${o.id}"><i class="bi bi-check2-circle"></i>Ho finito</button><form data-form="giornata" class="flex items-center gap-1.5"><input type="hidden" name="id" value="${o.id}"><input name="ore" type="number" min="0.5" step="0.5" required class="campo w-20 num" placeholder="ore" aria-label="Ore di oggi"><button class="btn btn-sec">Segna le ore di oggi</button></form></div><p class="text-xs text-grigio mt-1.5">Se il lavoro dura più giorni, segna le ore giorno per giorno.</p>`}</div>`; }).join('')}
    </div>
    ${fatti.length ? `<p class="text-sm font-bold mt-6 mb-2">Chiusi oggi</p><ul class="space-y-2">${fatti.map(o => `<li class="card p-4 flex flex-wrap items-center gap-3 text-sm lampo"><i class="bi bi-check2-circle text-ok text-lg"></i><span class="flex-1 min-w-[200px]"><strong>${srv(o.serv).nome}</strong> · ${cli(o.cli).nome}</span><span class="num">${oreN(o.ore)}</span>${o.doc ? `<span class="text-xs text-grigio truncate max-w-[220px]"><i class="bi bi-paperclip"></i> ${o.doc}</span>` : ''}<span class="chip c-bl"><i class="bi bi-send-check"></i>Passato in amministrazione</span></li>`).join('')}</ul>` : ''}
    <p class="text-xs text-grigio mt-6"><i class="bi bi-info-circle"></i> Non è un cronometro e nessuno controlla come lavori. Le ore servono a capire se il prezzo del servizio è giusto.</p>`;
  },
};

/* ---------- azioni ---------- */
let toastT;
function toast(msg) { $('#toast-t').textContent = msg.replace(/\.\.(?=\s|$)/g, '.'); $('#toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('on'), 4200); }
const spegni = () => { ORDINI.forEach(o => o.nuovo = false); CONTRATTI.forEach(k => k.agg = false); FATT.forEach(f => { f.agg = false; f.nuovo = false; }); };

const AZ_ = {
  menu: () => AZ_.profilo(),
  'chiudi-menu': () => document.body.classList.remove('menu-aperto'),
  vai: (v, el) => vai(v, el.dataset.p),
  ruolo: v => { S.ruolo = v; S.chiudi = null; chiudiTendine(); document.body.classList.remove('menu-aperto'); if (v !== 'tec' && (!vede(S.view) || S.view === 'home')) S.view = RUOLO[v][3]; render(true); $('#vista').scrollTop = 0; },
  per: v => { S.per = v; render(); },
  'per-marg': v => { S.perM = +v; render(); },
  dettaglio: v => dettaglio(v),
  'vai-chiudi': v => { chiudiModale(); vai(v); },
  'marg-dett': () => { S.margDett = !S.margDett; render(); },
  profilo: () => { const m = $('#profilo-menu'), aperto = m.classList.contains('hidden'); m.classList.toggle('hidden', !aperto); $('#profilo').setAttribute('aria-expanded', aperto); },
  guida: () => { S.guida = S.guida === false; render(); },
  benvenuto: () => benvenuto(),
  'benvenuto-ruolo': v => { chiudiModale(); S.modo = 'gestionale'; S.view = 'home'; AZ_.ruolo(v); },
  normativa: () => apriModale('Aggiornamenti normativi', `<div class="px-5 sm:px-6 py-5 max-h-[70vh] overflow-y-auto">${normativaCorpo()}</div><div class="flex justify-end px-5 sm:px-6 py-4 border-t border-linea"><button class="btn btn-sec" data-a="chiudi-modale">Chiudi</button></div>`, true),
  esporta: v => ESPORTA[v](),
  avvisi: () => { const p = $('#avvisi'), aperto = p.classList.contains('hidden'); chiudiTendine(); if (!aperto) return; const l = avvisi();
    p.innerHTML = `<p class="px-4 py-3 border-b border-linea font-bold text-sm">Avvisi</p><ul class="p-1.5 max-h-[60vh] overflow-y-auto">${l.map(e => `<li><button class="w-full text-left px-3 py-2.5 rounded hover:bg-[#F3F3F3] flex gap-3 items-start text-sm" data-a="vai" data-v="${e.go}"><i class="bi ${e.ico} text-petrolio mt-0.5"></i><span><span class="block">${e.tit}</span><span class="block text-xs text-grigio">${e.sub}</span></span></button></li>`).join('') || '<li class="px-3 py-4 text-sm text-grigio">Niente in sospeso.</li>'}</ul>`;
    p.classList.remove('hidden'); $('#avvisi-btn').setAttribute('aria-expanded', 'true'); },
  spotlight: () => { if (S.ruolo === 'tec') return; S.focusPrima = document.activeElement; chiudiTendine(); document.body.classList.remove('menu-aperto');
    $('#modale').innerHTML = `<div class="modale-velo spot-velo" data-a="spot-fuori"><div class="spotlight entra" role="dialog" aria-modal="true" aria-label="Cerca o chiedi agli agenti"><label class="spot-campo"><i class="bi bi-search"></i><span class="sr-only">Cerca o chiedi agli agenti</span><input id="spot-q" type="search" placeholder="Cerca clienti, fatture, preventivi, o chiedi agli agenti" autocomplete="off" data-cerca-tutto="s"><kbd>esc</kbd></label><div id="spot-ris" class="spot-ris">${spotVuoto()}</div></div></div>`;
    glossa($('#modale')); $('#spot-q').focus(); },
  'spot-fuori': (v, el, e) => { if (e.target === el) chiudiModale(); },
  'spot-prova': v => { const i = $('#spot-q'); i.value = v; i.dispatchEvent(new Event('input', { bubbles: true })); i.focus(); },
  'spot-dec': v => { chiudiModale(); AZ_.modo('sala'); if (!SALA.decisioni().some(d => d.id === v)) return; SALA.stato.sel = null; SALA.stato.stanza = null; SALA.stato.aperta = v; render(); },
  'spot-sala': () => { chiudiModale(); AZ_.modo('sala'); },
  'cerca-apri': () => AZ_.spotlight(),
  'cerca-apri-vecchio': () => { apriModale('Cerca', `<div class="p-4 sm:p-5"><label class="relative block"><span class="sr-only">Cerca</span><i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-grigio text-sm"></i><input id="cerca-m" type="search" class="campo w-full !pl-8" placeholder="Clienti, preventivi, fatture, fornitori" data-cerca-tutto="m" autocomplete="off"></label><div id="risultati-m" class="mt-2"></div></div>`); $('#cerca-m').focus(); },
  'ris-cli': v => { chiudiModale(); chiudiTendine(); S.cliSel = +v; vai('clienti'); },
  'ris-ord': v => { chiudiModale(); chiudiTendine(); const o = ord(v); S.kf = { tec: '', q: o.num || cli(o.cli).nome }; vai('ordini'); setTimeout(() => $('#kanban')?.scrollIntoView({ block: 'start' }), 50); },
  'nuovo-lavoro': () => apriModale('Nuovo lavoro', formLavoro()),
  'assegna-apri': v => { const o = ord(v); apriModale(o.stato === 'assegnato' ? 'Riassegna il lavoro' : 'Assegna il lavoro', formAssegna(o)); },
  rimetti: v => { spegni(); const o = ord(v); Object.assign(o, { stato: 'confermato', tec: null, data: null, nuovo: true }); chiudiModale(); toast('Rimesso tra i lavori da assegnare.'); render(); },
  indietro: v => { spegni(); const o = ord(v); Object.assign(o, { stato: 'preventivo', nuovo: true }); S.confOra = Math.max(0, S.confOra - 1); toast('Rimesso tra i preventivi inviati.'); render(); },
  riapri: v => { spegni(); const o = ord(v); if (o.rif) { STORICO.splice(STORICO.indexOf(o.rif), 1); S.mese.ore -= o.ore; o.rif = null; } Object.assign(o, { stato: 'assegnato', chiusoOra: false, nuovo: true }); toast(`Riaperto: torna tra i lavori di ${o.tec}.`); render(); },
  'chiudi-dir': v => apriModale('Chiudi il lavoro', formChiusura(ord(v))),
  'nuovo-contratto': () => apriModale('Nuovo contratto', formContratto()),
  'modifica-contratto': v => apriModale('Modifica il contratto', formContratto(CONTRATTI.find(k => k.id == v))),
  disdici: v => { spegni(); const k = CONTRATTI.find(x => x.id == v); k.disdetto = true; k.proposta = null; k.agg = true; ATTIVITA.unshift({ cli: k.cli, tipo: 'nota', testo: `Disdetto il contratto ${srv(k.serv).nome}.`, g: 0, chi: 'Giorgio' }); chiudiModale(); toast(`Disdetta registrata: ${srv(k.serv).nome} di ${cli(k.cli).nome} resta attivo fino al rinnovo, poi si ferma.`); render(); },
