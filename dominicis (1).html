<html lang="it">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-calce: #F3F4F1;
    --color-cobalto: #1D3FBF;
    --color-cobalto-scuro: #15309A;
    --color-cobalto-chiaro: #A9B8EE;
    --color-cobalto-velo: #E8ECFA;
    --color-giallo: #F2B705;
    --color-giallo-velo: #FDF4D3;
    --color-ambra: #7A5600;
    --color-inchiostro: #1B1F24;
    --color-grigio: #5D6470;
    --color-linea: #E2E4DF;

<style>
  @layer theme, base, components, utilities;
  html, body { height: 100%; }
  body { overflow: hidden; margin: 0; background: #F3F4F1; color: #1B1F24; font-family: "IBM Plex Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  button:not(:disabled), [role="button"]:not(:disabled), a[href], label[for], select, summary, tr.clic, input[type="checkbox"], input[type="range"] { cursor: pointer; }
  :disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid #1D3FBF; outline-offset: 2px; border-radius: 6px; }

  #app { display: flex; height: 100dvh; overflow: hidden; flex-direction: column; }
  @media (min-width: 1024px) {
    #app { display: grid; grid-template-columns: 252px 1fr; grid-template-rows: 100%; }
  }
  #app > *, #vista, #colonna { min-height: 0; }

  #sidebar { display: none; }
  @media (min-width: 1024px) { #sidebar { display: flex; } }
  body.menu-aperto #sidebar { display: flex; position: fixed; top: 0; bottom: 0; left: 0; width: 272px; z-index: 40; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  #velo-menu { display: none; }
  body.menu-aperto #velo-menu { display: block; }

  #modale { display: none; }
  body.modale-aperta #modale { display: flex; }

  /* componenti in un layer: cosi' le utility di Tailwind (hidden, lg:hidden...) vincono */
  @layer components {
  .num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card { background: #fff; border: 1px solid #E2E4DF; border-radius: 20px; box-shadow: 0 1px 2px rgba(27,31,36,.04), 0 12px 28px -14px rgba(27,31,36,.14); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; border-radius: 10px; font-weight: 600; font-size: .875rem; padding: .55rem .95rem; transition: background-color .15s, border-color .15s, transform .1s; white-space: nowrap; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; }
  .btn-pri { background: #1D3FBF; color: #fff; }
  .btn-pri:hover { background: #15309A; }
  .btn-sec { background: #fff; color: #1B1F24; border: 1px solid #D5D8D1; }
  .btn-sec:hover { border-color: #1B1F24; }
  .btn-gh { color: #1D3FBF; padding-left: .5rem; padding-right: .5rem; }
  .btn-gh:hover { background: #E8ECFA; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; font-size: .75rem; font-weight: 600; padding: .15rem .6rem; white-space: nowrap; }
  .c-ok { background: #E3F2EA; color: #1F6B41; }
  .c-ko { background: #FDF4D3; color: #7A5600; }
  .c-at { background: #EEF0EC; color: #5D6470; }
  .c-bl { background: #E8ECFA; color: #1D3FBF; }
  .c-pieno { background: #1D3FBF; color: #fff; }
  .seg { display: inline-flex; background: #E9EBE6; border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border-radius: 8px; padding: .35rem .75rem; font-size: .8125rem; font-weight: 600; color: #5D6470; }
  .seg button[aria-pressed="true"] { background: #fff; color: #1B1F24; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .tab-t { width: 100%; border-collapse: collapse; font-size: .875rem; }
  .tab-t th { text-align: left; font-weight: 500; color: #5D6470; font-size: .75rem; padding: .6rem .75rem; border-bottom: 1px solid #E2E4DF; white-space: nowrap; }
  .tab-t td { padding: .7rem .75rem; border-bottom: 1px solid #EEF0EC; vertical-align: middle; }
  .tab-t tr:last-child td { border-bottom: 0; }
  .tab-t tr.clic:hover td { background: #F7F8F5; }
  .tab-t .r { text-align: right; }
  .tab-t th:first-child, .tab-t td:first-child { padding-left: 1.5rem; }
  .tab-t th:last-child, .tab-t td:last-child { padding-right: 1.5rem; }
  .tab-t tr.sel td { background: #E8ECFA; }
  .tab-t tr.sel td:first-child { box-shadow: inset 3px 0 0 #1D3FBF; }

  .nav-i { display: flex; align-items: center; gap: .7rem; padding: .5rem .7rem; border-radius: 9px; font-size: .9rem; font-weight: 500; color: #3A4049; width: 100%; text-align: left; }
  .nav-i:hover { background: #F0F1ED; }
  .nav-i[aria-current="page"] { background: #E8ECFA; color: #1D3FBF; font-weight: 600; }
  .nav-i .bi { font-size: 1.05rem; }
  .badge { margin-left: auto; background: #F2B705; color: #1B1F24; font-size: .75rem; font-weight: 700; border-radius: 999px; min-width: 1.25rem; padding: 0 .4rem; text-align: center; }

  /* la firma: ordinato / consegnato / fatturato, in una barra sola */
  .tribar { position: relative; height: 10px; }
  .tribar > span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; }
  .tb-tot { background: #E2E4DF; }
  .tb-a { background: #A9B8EE; }
  .tb-b { background: #1D3FBF; }
  .tb-over { background: repeating-linear-gradient(-45deg, #F2B705 0 4px, #F8D35A 4px 8px); border-radius: 0 999px 999px 0 !important; }
  .tb-prev { width: 2px; top: -4px !important; bottom: -4px !important; background: #1B1F24; border-radius: 1px !important; }
  .legenda { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .75rem; color: #5D6470; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .35rem; vertical-align: -1px; }

  .in-num { width: 7.5rem; text-align: right; border: 1px solid #D5D8D1; border-radius: 8px; padding: .3rem .5rem; background: #fff; font-family: "IBM Plex Mono", monospace; font-size: .85rem; }
  .in-num:hover { border-color: #1B1F24; }
  .in-num.vuoto { background: #FDF4D3; border-color: #F2B705; }

  .unita { aspect-ratio: 1; border-radius: 8px; font-size: .75rem; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid transparent; font-family: "IBM Plex Mono", monospace; }
  .u-libera { background: #fff; border-color: #E2E4DF; color: #5D6470; }
  .u-trattativa { background: #E8ECFA; color: #1D3FBF; }
  .u-compromesso { background: #1D3FBF; color: #fff; }
  .unita[aria-pressed="true"] { outline: 3px solid #F2B705; outline-offset: 1px; }

  .entra { animation: entra .35s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .lampo { animation: lampo 1.6s ease-out; }
  @keyframes lampo { 0% { background: #FDF4D3; } 100% { background: transparent; } }
  .gira { animation: gira 1s linear infinite; display: inline-block; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .scan { position: absolute; left: 8%; right: 8%; height: 3px; background: #F2B705; box-shadow: 0 0 18px #F2B705; animation: scan 1.4s ease-in-out infinite alternate; }
  @keyframes scan { from { top: 18%; } to { top: 80%; } }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: all .25s; z-index: 70; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  .scroll-x { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; } /* relative: le etichette sr-only (absolute) restano dentro il ritaglio */
  .carta { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(27,31,36,.08); border-radius: 6px; }

  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- ============ APPLICAZIONE ============ -->
<div id="app">
  <aside id="sidebar" class="flex-col bg-white border-r border-linea h-full" aria-label="Menu principale">
    <div class="px-5 h-16 flex items-center gap-2.5 border-b border-linea shrink-0">
      <span class="w-8 h-8 rounded-lg bg-cobalto text-white flex items-center justify-center"><i class="bi bi-bricks"></i></span>
      <div class="leading-tight">
        <p class="font-display font-extrabold">Commesse</p>
        <p class="text-xs text-grigio">demo · dati inventati</p>
      </div>
    </div>
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-5" id="nav"></nav>
    <div class="p-3 border-t border-linea shrink-0">
      <div class="flex items-center gap-3 px-2 py-2">

        <div class="leading-tight text-sm"><p class="font-semibold" id="utente-nome">Andrea Pregnolato</p><p class="text-grigio text-xs" id="utente-ruolo">Direttore operativo</p></div>
      </div>

  </aside>
  <div id="velo-menu" class="fixed inset-0 bg-inchiostro/40 z-30" data-a="chiudi-menu"></div>

  <div id="colonna" class="flex flex-col h-full">

      <button class="lg:hidden btn btn-sec !px-2.5" data-a="menu" aria-label="Apri il menu"><i class="bi bi-list text-lg"></i></button>
      <h2 id="titolo" class="font-display font-bold text-base sm:text-lg truncate"></h2>

          <button data-a="ruolo" data-v="pm">Project manager</button>
        </div>
        <button class="btn btn-pri" data-a="bolla"><i class="bi bi-camera"></i><span class="hidden md:inline">Fotografa una bolla</span></button>

    <div class="sm:hidden bg-white border-b border-linea px-4 py-2 flex items-center gap-2 text-xs text-grigio shrink-0">
      Stai usando come:
      <div class="seg" role="group" aria-label="Chi sta usando il gestionale">
        <button data-a="ruolo" data-v="direzione">Direzione</button>
        <button data-a="ruolo" data-v="pm">PM</button>

    <main id="vista" class="flex-1 overflow-y-auto"></main>

</div>

<div id="modale" class="fixed inset-0 z-50 bg-inchiostro/50 items-center justify-center sm:p-4" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"><div class="bg-inchiostro text-white text-sm rounded-xl px-4 py-3 shadow-xl flex items-center gap-2 max-w-[90vw]"><i class="bi bi-check2-circle text-giallo"></i><span id="toast-t"></span></div></div>

<script>
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const eur = n => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' }).format(Math.round(n));
const nf = (n, d = 0) => new Intl.NumberFormat('it-IT', { maximumFractionDigits: d, useGrouping: 'always' }).format(n);
const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
const r100 = x => Math.round(x / 100) * 100;
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const pc = (a, b) => b ? Math.round(a / b * 100) : 0;
const SOGLIA_ACQUISTI = 50000; // esempio: la soglia vera la decide Andrea
const OGGI = new Date();
const giorno = n => { const x = new Date(OGGI); x.setDate(x.getDate() + n); return x; };
const dmy = n => giorno(n).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
const dm = n => giorno(n).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
const ANNO = OGGI.getFullYear();
const MESE = OGGI.toLocaleDateString('it-IT', { month: 'long' });
const MESE_PRIMA = giorno(-OGGI.getDate()).toLocaleDateString('it-IT', { month: 'long' });

function tribar(tot, a, b, prev) {
  const max = Math.max(tot, a, prev || 0) || 1;
  const w = x => (x / max * 100).toFixed(2) + '%';
  const over = Math.max(a, prev || 0) - tot;
  return `<div class="tribar" role="img" aria-label="${nf(pc(a, tot))}% e ${nf(pc(b, tot))}% del totale">
    <span class="tb-tot" style="width:${w(tot)}"></span>
    <span class="tb-a" style="width:${w(Math.min(a, tot))}"></span>
    <span class="tb-b" style="width:${w(Math.min(b, tot))}"></span>
    ${over > 0 ? `<span class="tb-over" style="left:${w(tot)};width:${w(over)}"></span>` : ''}
    ${prev ? `<span class="tb-prev" style="left:calc(${w(prev)} - 1px)"></span>` : ''}
  </div>`;
}
const legendaBudget = `<div class="legenda"><span><i style="background:#E2E4DF"></i>budget</span><span><i style="background:#A9B8EE"></i>impegnato</span><span><i style="background:#1D3FBF"></i>autorizzato (SAL)</span><span><i style="background:#1B1F24;width:2px"></i>previsione a finire</span><span><i style="background:#F2B705"></i>oltre budget</span></div>`;
const legendaOrdine = `<div class="legenda"><span><i style="background:#E2E4DF"></i>ordinato</span><span><i style="background:#A9B8EE"></i>consegnato</span><span><i style="background:#1D3FBF"></i>fatturato</span></div>`;

/* ---------- dati finti ---------- */
const VOCI_I = [['Demolizioni e scavi', .05], ['Strutture in c.a.', .19], ['Murature e tramezze', .08], ['Impianto idrico e termico', .14], ['Impianto elettrico', .09], ['Serramenti', .11], ['Pavimenti e rivestimenti', .12], ['Cappotto e facciate', .10], ['Finiture e tinteggiature', .06], ['Sistemazioni esterne', .06]];
const VOCI_R = [['Demolizioni e smaltimenti', .08], ['Murature e tramezze', .10], ['Impianto idrico e termico', .20], ['Impianto elettrico', .14], ['Pavimenti e rivestimenti', .22], ['Serramenti', .14], ['Finiture e tinteggiature', .12]];

const CANTIERI = [
  { id: 'I-07', nome: 'Residenza ex Manifattura', luogo: 'Verona, Borgo Roma', bu: 'imm', pm: 'Luca Benedetti', avanz: 38, budget: 6800000, unita: 42, dev: { 3: .09, 5: .04, 1: -.02 }, agg: `${dm(-12)} alle 18:04` },
  { id: 'I-09', nome: 'Corte San Michele', luogo: 'San Michele Extra', bu: 'imm', pm: 'Sara Tommasi', avanz: 12, budget: 2950000, unita: 18, dev: { 0: .06 }, agg: `${dm(-3)} alle 09:12` },
  { id: 'R-24', nome: 'Casa Bertoldi', luogo: 'Verona, via Mazzini', bu: 'ris', pm: 'Marco Rizzi', avanz: 62, budget: 148000, dev: { 2: .03 }, agg: `${dm(-4)} alle 17:30` },
  { id: 'R-27', nome: 'Villa Zanetti', luogo: 'San Martino Buon Albergo', bu: 'ris', pm: 'Luca Benedetti', avanz: 28, budget: 312000, dev: { 4: .12 }, agg: `${dm(-14)} alle 12:40` },
  { id: 'R-31', nome: 'Bagno e cucina Lonardi', luogo: 'Verona, Borgo Trento', bu: 'ris', pm: 'Marco Rizzi', avanz: 85, budget: 46500, dev: {}, agg: `${dm(-1)} alle 19:02` },
];
function creaLav(c) {
  const voci = c.bu === 'imm' ? VOCI_I : VOCI_R, n = voci.length, a = c.avanz / 100;
  c.lav = voci.map(([voce, q], i) => {
    const b = r100(c.budget * q), dev = c.dev[i] || 0;
    const fatto = clamp(a * 1.9 - i / n * 0.95);
    const imp = fatto > 0 ? clamp(fatto + 0.4) : (i < n * 0.6 && a > 0 ? 0.3 : 0);
    const impE = r100(b * imp * (1 + dev * 0.7));
    return { voce, budget: b, imp: impE, aut: Math.min(impE, r100(b * fatto * (1 + dev * 0.4))), prev: r100(b * (1 + dev)) };
  });
  c.storico = [];
}
CANTIERI.forEach(creaLav);
const cant = id => CANTIERI.find(c => c.id === id);
const totC = c => ({ b: sum(c.lav, v => v.budget), i: sum(c.lav, v => v.imp), a: sum(c.lav, v => v.aut), p: sum(c.lav, v => v.prev) });

const ORDINI = [
  { id: 'ODA-2026-0142', forn: 'Gres Nordest srl', cant: 'I-07', voce: 'Pavimenti e rivestimenti', data: dmy(-33), righe: [
      { d: 'Gres porcellanato 60x60 grigio cemento', um: 'mq', ord: 840, cons: 520, fatt: 520, p: 24.5 },
      { d: 'Adesivo cementizio C2TE S1', um: 'sacchi', ord: 300, cons: 180, fatt: 180, p: 11.8 },
      { d: 'Profilo di finitura in alluminio 10 mm', um: 'ml', ord: 260, cons: 260, fatt: 0, p: 6.2 }],
    bolle: [{ n: 'DDT 1102', data: dmy(-20), chi: 'Luca Benedetti' }, { n: 'DDT 1149', data: dmy(-7), chi: 'Luca Benedetti' }], anomalie: [] },
  { id: 'ODA-2026-0151', forn: 'Cls Veneta Forniture', cant: 'I-07', voce: 'Strutture in c.a.', data: dmy(-117), righe: [
      { d: 'Calcestruzzo C25/30 XC2 S4', um: 'mc', ord: 620, cons: 610, fatt: 540, p: 118 },
      { d: 'Acciaio B450C in barre', um: 'kg', ord: 48000, cons: 48000, fatt: 48000, p: 0.98 }],
    bolle: [{ n: '14 DDT', data: 'dal ' + dmy(-117), chi: 'Luca Benedetti' }], anomalie: [] },
  { id: 'ODA-2026-0156', forn: 'Serramenti Valdadige', cant: 'I-07', voce: 'Serramenti', data: dmy(-2), stato: 'approvazione', righe: [
      { d: 'Finestra PVC 2 ante 120x140', um: 'pz', ord: 96, cons: 0, fatt: 0, p: 640 },
      { d: 'Portafinestra PVC 2 ante 140x240', um: 'pz', ord: 58, cons: 0, fatt: 0, p: 1080 }],
    bolle: [], anomalie: [] },
  { id: 'ODA-2026-0160', forn: 'Termoidraulica Berica', cant: 'R-24', voce: 'Impianto idrico e termico', data: dmy(-27), righe: [
      { d: 'Collettore complanare 8 vie', um: 'pz', ord: 2, cons: 2, fatt: 2, p: 186 },
      { d: 'Tubo multistrato 16x2', um: 'ml', ord: 400, cons: 300, fatt: 300, p: 2.4 },
      { d: 'Caldaia a condensazione 25 kW', um: 'pz', ord: 1, cons: 1, fatt: 0, p: 1890 }],
    bolle: [{ n: 'DDT 5521', data: dmy(-19), chi: 'Marco Rizzi' }], anomalie: [] },
  { id: 'ODA-2026-0163', forn: 'Gres Nordest srl', cant: 'R-27', voce: 'Pavimenti e rivestimenti', data: dmy(-10), righe: [
      { d: 'Parquet rovere spazzolato 14 mm', um: 'mq', ord: 180, cons: 0, fatt: 0, p: 58 }],
    bolle: [], anomalie: [] },
  { id: 'ODA-2026-0138', forn: 'Edilmateriali Lessini', cant: 'R-31', voce: 'Murature e tramezze', data: dmy(-69), righe: [
      { d: 'Lastra in cartongesso idrorepellente 12,5 mm', um: 'mq', ord: 90, cons: 90, fatt: 90, p: 7.9 },
      { d: 'Profili, guide e montanti', um: 'ml', ord: 220, cons: 220, fatt: 220, p: 1.6 }],
    bolle: [{ n: 'DDT 778', data: dmy(-62), chi: 'Marco Rizzi' }], anomalie: [] },
];
const ordine = id => ORDINI.find(o => o.id === id);
const valO = (o, k) => sum(o.righe, r => r[k] * r.p);
function statoO(o) {
  if (o.stato === 'approvazione') return ['ko', 'Da approvare'];
  const ord = valO(o, 'ord'), cons = valO(o, 'cons'), fatt = valO(o, 'fatt');
  if (fatt >= ord) return ['ok', 'Chiuso'];
  if (cons >= ord) return ['pieno', 'Consegnato'];
  if (cons > 0) return ['bl', 'In consegna'];
  return ['at', 'Inviato'];
}

const SAL = [
  { id: 'SAL-I07-03', sub: 'Impianti Rossato srl', cant: 'I-07', voce: 'Impianto idrico e termico', n: 3, data: dmy(-4), importo: 38400, fatt: { n: 'FT 412/2026', imp: 38400 } },

function dettaglioSal(s) {
  const [cls0, t] = esito(s), c = cant(s.cant), cls = s.risolto ? 'bl' : cls0;
  const riga = (l, a, b, evid) => `<div class="grid grid-cols-[minmax(0,1fr)_auto_auto] gap-3 py-2 border-b border-[#EEF0EC] text-sm ${evid ? 'bg-giallo-velo -mx-6 px-6' : ''}"><span class="min-w-0 [overflow-wrap:anywhere]">${l}</span><span class="num w-[5.5rem] text-right">${a}</span><span class="num w-[5.5rem] text-right">${b}</span></div>`;
  let corpo;
  if (!s.fatt) corpo = `<p class="text-sm text-grigio">Il SAL è autorizzato e già inviato a ${s.sub}. Quando arriva la fattura il confronto parte da solo.</p>`;
  else {
    const diff = s.senzaSal ? 0 : s.fatt.imp - s.importo;
    corpo = `<div class="grid grid-cols-[minmax(0,1fr)_auto_auto] gap-3 text-xs text-grigio pb-1"><span></span><span class="w-[5.5rem] text-right">SAL</span><span class="w-[5.5rem] text-right">Fattura</span></div>
    ${s.senzaSal ? riga(s.fatt.extra, '–', eur(s.fatt.imp), true) : riga(s.voce, eur(s.importo), eur(s.fatt.imp - diff))}
    ${diff ? riga(s.fatt.extra, '–', eur(diff), true) : ''}
    <div class="grid grid-cols-[minmax(0,1fr)_auto_auto] gap-3 pt-2 text-sm font-semibold"><span>Totale</span><span class="num w-[5.5rem] text-right">${s.importo != null ? eur(s.importo) : '–'}</span><span class="num w-[5.5rem] text-right">${eur(s.fatt.imp)}</span></div>`;
  }
  const azioni = cls !== 'ko' ? '' : s.senzaSal
    ? `<p class="text-sm mt-4">${s.sub} ha fatturato un noleggio che nessun PM ha autorizzato.</p><div class="flex flex-wrap gap-2 mt-3"><button class="btn btn-pri" data-a="risolvi" data-v="${s.id}|pm">Chiedi a ${c.pm.split(' ')[0]} di autorizzarlo</button><button class="btn btn-sec" data-a="risolvi" data-v="${s.id}|contesta">Contesta la fattura</button></div>`

  return `<div class="card p-6 entra 2xl:sticky 2xl:top-0">
    <div class="flex justify-between items-start gap-2 mb-3"><div><p class="font-display font-bold text-lg">${s.sub}</p><p class="text-xs text-grigio">${c.id} ${c.nome}${s.fatt ? ` · ${s.fatt.n}` : ''}</p></div><span class="chip c-${cls}">${t}</span></div>
    ${corpo}${azioni}</div>`;
}

function renderSalModale() {
  const libero = CONTRATTI.filter(c => !c.fatto);
  const c = CONTRATTI.find(x => x.id === S.salC) || libero[0] || CONTRATTI[0];
  S.salC = c.id;
  const min = Math.ceil(c.gia / c.importo * 100);
  if (!S.salPerc || S.salPerc < min) S.salPerc = Math.min(100, min + 8);
  const lordo = Math.max(0, c.importo * S.salPerc / 100 - c.gia), rit = lordo * .05;
  $('#modale').innerHTML = `<div class="bg-white w-full sm:max-w-lg h-full sm:h-auto sm:rounded-2xl overflow-y-auto entra">
    <div class="p-5 border-b border-linea flex justify-between items-center"><p class="font-display font-bold text-lg">Autorizza un SAL</p><button class="w-9 h-9 rounded-full hover:bg-calce" data-a="chiudi-modale" aria-label="Chiudi"><i class="bi bi-x-lg"></i></button></div>

        <select id="sal-c" class="mt-1.5 w-full rounded-xl border border-linea p-2.5 bg-white">${CONTRATTI.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''} ${x.fatto ? 'disabled' : ''}>${x.sub} · ${x.cant} ${x.voce}${x.fatto ? ' (già fatto)' : ''}</option>`).join('')}</select></div>
      <div class="grid grid-cols-2 gap-3 text-sm"><div class="rounded-xl bg-calce p-3"><p class="text-xs text-grigio">Importo del contratto</p><p class="num">${eur(c.importo)}</p></div><div class="rounded-xl bg-calce p-3"><p class="text-xs text-grigio">Già autorizzato</p><p class="num">${eur(c.gia)} · ${pc(c.gia, c.importo)}%</p></div></div>
      <div><label for="sal-p" class="text-sm font-semibold flex justify-between"><span>Avanzamento a oggi</span><span class="num" id="sal-pv">${S.salPerc}%</span></label>
        <input id="sal-p" type="range" min="${min}" max="100" value="${S.salPerc}" class="w-full mt-2 accent-[#1D3FBF]"></div>
      <div class="rounded-xl border border-linea p-4 text-sm space-y-1.5">
        <div class="flex justify-between"><span>Lavori di questo SAL</span><span class="num" id="sal-l">${eur(lordo)}</span></div>
        <div class="flex justify-between text-grigio"><span>Ritenuta a garanzia 5%</span><span class="num" id="sal-r">−${eur(rit)}</span></div>
        <div class="flex justify-between font-semibold pt-1.5 border-t border-linea"><span>Da fatturare</span><span class="num" id="sal-f">${eur(lordo - rit)}</span></div></div>

let toastT;

const parseNum = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.'));

const AZ = {
  menu: () => document.body.classList.add('menu-aperto'),
  'chiudi-menu': () => document.body.classList.remove('menu-aperto'),
  vai: (v, el) => { chiudiModale(); vai(v, el.dataset.p || null); },
  ruolo: v => { S.ruolo = v; S.bu = 'tutti'; render(); },
  bu: v => { S.bu = v; render(); },
  tab: v => { S.tab = v; render(); },
  unita: v => { S.unita = v; render(); },
  variante: v => { const [id, i] = v.split('|'); const u = UNITA.find(x => x.id === id); u.varianti[i].stato = 'Inviata al cliente'; toast(`Preventivo della variante inviato a ${u.cliente}.`); render(); },
  'filtro-o': v => { S.filtroO = v; render(); },
  'filtro-sal': v => { S.filtroSal = v; render(); },
  'sal-sel': v => { S.salSel = v; render(); },
  risolvi: v => {
    const [id, how] = v.split('|'), s = SAL.find(x => x.id === id);
    if (how === 'nc') { s.risolto = 'Nota di credito chiesta'; toast(`Richiesta di nota di credito inviata a ${s.sub}.`); }
    if (how === 'accetta') { s.importo = s.fatt.imp; s.risolto = 'Differenza accettata'; toast('SAL aggiornato. La fattura ora combacia.'); }
    if (how === 'pm') { s.risolto = 'Mandata al PM'; toast(`${cant(s.cant).pm} ha ricevuto la richiesta di autorizzazione.`); }
    if (how === 'contesta') { s.risolto = 'Contestata'; toast(`Contestazione inviata a ${s.sub}.`); }
    render();
  },
  'simula-fatt': (v, el, e) => {
    e.stopPropagation();
    const s = SAL.find(x => x.id === v);
    s.fatt = { n: `FT ${300 + Math.floor(Math.random() * 600)}/${ANNO}`, imp: s.importo };
    SAL.forEach(x => x.nuovo = false); s.nuovo = true; S.salSel = s.id;
    toast(`Fattura di ${s.sub} arrivata: combacia con il SAL, archiviata.`); render();
  },
  approva: v => { const o = ordine(v); delete o.stato; toast(`Ordine approvato e inviato a ${o.forn}.`); render(); },
  anomalia: v => {
    const o = ordine(S.param);
    if (v === 'aggiungi') { o.righe.push({ d: 'Battiscopa in gres 8 cm', um: 'ml', ord: 120, cons: 120, fatt: 0, p: 4.9, nuova: true }); toast('Riga aggiunta all\'ordine con il prezzo di listino.'); }
    else toast('Segnalazione inviata a Gres Nordest: il battiscopa torna indietro o viene stornato.');
    o.anomalie = []; render();
  },
  bolla: () => { S.bolla = S.bollaFatta ? 3 : 0; renderBolla(); apriModale(); },
  'bolla-scatta': () => {
    S.bolla = 1; renderBolla();
    const passi = ['Fornitore: Gres Nordest srl', 'Ordine ODA-2026-0142 trovato', '3 righe lette, 1 fuori ordine'];
    passi.forEach((p, i) => setTimeout(() => { const el = $('#lettura'); if (el) el.insertAdjacentHTML('beforeend', `<p class="entra"><i class="bi bi-check2 text-ok"></i> ${p}</p>`); }, 450 * (i + 1)));
    setTimeout(() => { if (S.bolla === 1 && document.body.classList.contains('modale-aperta')) { S.bolla = 2; renderBolla(); } }, 1900);
  },
  'bolla-conferma': () => {
    const o = ordine('ODA-2026-0142');
    o.righe[0].cons += S.bollaQ[0]; o.righe[1].cons += S.bollaQ[1];
    o.bolle.forEach(b => b.nuova = false);
    o.bolle.push({ n: 'DDT 1187', data: dmy(0), chi: 'Luca Benedetti', nuova: true });
    o.anomalie = ['Bolla DDT 1187: battiscopa in gres 8 cm, 120 ml, non è nell\'ordine.'];
    o.agg = true; S.bollaFatta = true; S.bolla = 3; renderBolla(); render();
  },
  'chiudi-modale': () => chiudiModale(),
  'apri-sal': () => { S.salPerc = 0; S.salC = null; renderSalModale(); apriModale(); },
  'sal-ok': () => {
    const c = CONTRATTI.find(x => x.id === S.salC);
    const lordo = c.importo * S.salPerc / 100 - c.gia, daF = r100(lordo * .95);
    const n = Math.floor(c.gia / c.importo * 10) + 1;
    SAL.forEach(x => x.nuovo = false);
    SAL.unshift({ id: `SAL-${c.cant.replace('-', '')}-N${n}`, sub: c.sub, cant: c.cant, voce: c.voce, n, data: dmy(0), importo: daF, fatt: null, nuovo: true });
    c.gia += lordo; c.fatto = true; S.salSel = SAL[0].id;
    chiudiModale(); toast(`SAL inviato a ${c.sub} e all'amministrazione.`); render();
  },
  avanza: v => {
    const c = CLIENTI.find(x => x.id == v); c.fase++; c.gg = 0; CLIENTI.forEach(x => x.nuovo = false); c.nuovo = true;
    if (c.fase === FASI.length - 1 && !c.cantiere) {
      const id = 'R-' + (32 + CANTIERI.filter(x => x.bu === 'ris').length - 3);
      const nc = { id, nome: c.lav + ' ' + c.nome.split(' ').slice(-1)[0], luogo: c.luogo, bu: 'ris', pm: 'Marco Rizzi', avanz: 0, budget: r100(c.val * .78), dev: {}, agg: 'oggi' };
      creaLav(nc); CANTIERI.push(nc); c.cantiere = id;
      toast(`Passato a Marco Rizzi: nasce il cantiere ${id} con un budget di ${eur(nc.budget)}.`);
    } else toast(`${c.nome}: ${FASI[c.fase].toLowerCase()}.`);
    render();
  },
  genera: () => {
    const box = $('#doc-prev');
    box.innerHTML = `<div class="card p-8"><p class="font-semibold"><i class="bi bi-arrow-repeat gira"></i> Sistemo voci, capitoli e descrizioni…</p><ul class="mt-4 space-y-2 text-sm text-grigio" id="gen-l"></ul></div>`;
    ['8 lavorazioni riconosciute negli appunti', 'Divise in 6 capitoli', `Prezzi presi dal listino ${ANNO}`, '1 voce senza prezzo a listino'].forEach((t, i) => setTimeout(() => { const l = $('#gen-l'); if (l) l.insertAdjacentHTML('beforeend', `<li class="entra"><i class="bi bi-check2 text-ok"></i> ${t}</li>`); }, 350 * (i + 1)));
    setTimeout(() => { S.prevFatto = true; if (S.view === 'preventivi') { $('#doc-prev').innerHTML = docPreventivo(true); const b = document.querySelector('[data-a="genera"]'); if (b) b.innerHTML = '<i class="bi bi-magic"></i>Rifai il preventivo'; } }, 1700);
  },
  pdf: () => toast('Nella versione vera esce il PDF con la vostra carta intestata.'),
  'manda-prev': () => {
    if (VOCI_PREV.some(v => v[3] == null)) { toast('Prima metti il prezzo che manca (la voce in giallo).'); document.querySelector('.in-num.vuoto')?.focus(); return; }
    CLIENTI[3].val = r100(imponibilePrev()); toast(`Preventivo inviato alla famiglia Castagna: ${eur(imponibilePrev() * 1.1)} IVA compresa.`);
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  AZ[el.dataset.a]?.(el.dataset.v, el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.body.classList.contains('modale-aperta')) chiudiModale(); else document.body.classList.remove('menu-aperto'); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-a]')) { e.preventDefault(); e.target.click(); }
});
$('#modale').addEventListener('click', e => { if (e.target.id === 'modale') chiudiModale(); });

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.prev) {
    const [cid, i] = t.dataset.prev.split('|'), c = cant(cid), v = c.lav[i], nuovo = parseNum(t.value);
    if (!isFinite(nuovo) || nuovo < 0) { t.value = nf(v.prev); return; }
    if (nuovo === v.prev) return;
    c.storico.unshift({ chi: S.ruolo === 'pm' ? 'Luca Benedetti' : 'Andrea Pregnolato', quando: 'adesso', testo: `${v.voce}: previsione da ${eur(v.prev)} a ${eur(nuovo)}` });
    v.prev = nuovo; render(); toast('Salvato. La direzione vede già il nuovo numero.');
  }
  if (t.dataset.doc) { const [id, j] = t.dataset.doc.split('|'); UNITA.find(x => x.id === id).docs[j] = t.checked; render(); }
  if (t.id === 'sal-c') { S.salC = t.value; S.salPerc = 0; renderSalModale(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.prezzo != null) {
    const v = VOCI_PREV[t.dataset.prezzo], p = parseNum(t.value);
    v[3] = isFinite(p) && t.value.trim() !== '' ? p : null;
    t.classList.toggle('vuoto', v[3] == null);
    $('#imp-' + t.dataset.prezzo).innerHTML = v[3] == null ? '<span class="text-ambra text-xs">manca il prezzo</span>' : eur(v[2] * v[3]);
    const imp = imponibilePrev(); $('#p-imp').textContent = eur(imp); $('#p-iva').textContent = eur(imp * .1); $('#p-tot').textContent = eur(imp * 1.1);
  }
  if (t.dataset.bq != null) {
    const i = +t.dataset.bq, q = parseNum(t.value), r = ordine('ODA-2026-0142').righe[i];
    if (isFinite(q) && q >= 0) { S.bollaQ[i] = q; $('#resta-' + i).textContent = nf(Math.max(0, r.ord - r.cons - q)); }
  }
  if (t.id === 'sal-p') {
    S.salPerc = +t.value; const c = CONTRATTI.find(x => x.id === S.salC), l = Math.max(0, c.importo * S.salPerc / 100 - c.gia);
    $('#sal-pv').textContent = S.salPerc + '%'; $('#sal-l').textContent = eur(l); $('#sal-r').textContent = '−' + eur(l * .05); $('#sal-f').textContent = eur(l * .95);
    document.querySelector('[data-a="sal-ok"]').disabled = l <= 0;
  }
});

/* controllo dei dati finti: l'esito va in console */
function check() {
  const esiti = [];
  const a = (cond, msg) => { console.assert(cond, msg); esiti.push(!!cond); };
  CANTIERI.forEach(c => {
    const t = totC(c);
    a(Math.abs(t.b - c.budget) <= c.lav.length * 100, `${c.id}: la somma delle lavorazioni (${t.b}) non torna con il budget (${c.budget})`);
    c.lav.forEach(v => a(v.aut <= v.imp, `${c.id} ${v.voce}: autorizzato oltre l'impegnato`));
  });
  ORDINI.forEach(o => o.righe.forEach(r => a(r.fatt <= r.cons && r.cons <= r.ord, `${o.id} ${r.d}: fatturato ≤ consegnato ≤ ordinato non torna`)));
  a(UNITA.length === cant('I-07').unita, 'le unità di I-07 non sono quante ne dichiara il cantiere');
  CLIENTI.filter(c => c.fase === FASI.length - 1).forEach(c => a(cant(c.cantiere), `${c.nome}: passato al PM senza cantiere`));
  CLIENTI.filter(c => c.fase < FASI.length - 1).forEach(c => a(!c.cantiere, `${c.nome}: ha già un cantiere prima di passare al PM`));
  CLIENTI.filter(c => c.cantiere).forEach(c => { const q = cant(c.cantiere).budget / c.val; a(q >= .6 && q <= .85, `${c.cantiere}: costi al ${Math.round(q * 100)}% del contratto, fuori dal 60-85%`); });
  a(eccezioni().length === eccezioni().filter(e => cant(e.cant)).length, 'una eccezione punta a un cantiere che non esiste');
  const ok = esiti.filter(Boolean).length;
  console.log(`[check] ${ok}/${esiti.length} controlli sui dati: ${ok === esiti.length ? 'dati coerenti' : 'dati incoerenti'}`);
  return ok === esiti.length;
}
render(true);
check();
</script>
