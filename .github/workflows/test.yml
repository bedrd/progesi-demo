# a ogni pull request e a ogni push su main: giri di prova della demo con Chrome headless
name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: test
      - name: giri di prova
        working-directory: test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm test | tee esito.txt
          ! grep -E "^NO |ERRORI: \[" esito.txt
